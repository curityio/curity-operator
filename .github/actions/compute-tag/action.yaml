name: Compute Image Tag
description: Compute a versioned image tag based on the latest git tag.

inputs:
  pr-number:
    description: 'PR number to include in the tag (omit for non-PR builds)'
    required: false
    default: ''

outputs:
  version:
    description: 'SemVer-ish version, used verbatim as the image tag (e.g. 0.2.0-pr-42-abc123d or 0.2.0-abc123d)'
    value: ${{ steps.compute.outputs.version }}

runs:
  using: composite
  steps:
    - name: Compute tag
      id: compute
      shell: bash
      run: |
        SHORT_SHA=$(echo "${{ github.event.pull_request.head.sha || github.sha }}" | cut -c1-7)
        BASE=$(git describe --tags --abbrev=0 2>/dev/null || echo "0.0.0")

        if [ -n "${{ inputs.pr-number }}" ]; then
          VERSION="${BASE}-pr-${{ inputs.pr-number }}-${SHORT_SHA}"
        else
          VERSION="${BASE}-${SHORT_SHA}"
        fi

        echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
