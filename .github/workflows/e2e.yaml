name: E2E Tests

on:
  pull_request:
    types: [labeled]

concurrency:
  group: e2e-aks
  cancel-in-progress: false

jobs:
  e2e-tests:
    name: Run E2E Tests (AKS)
    if: ${{ github.event.label.name == 'ok-to-test/e2e' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Remove test label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: ok-to-test/e2e

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compute image tag
        id: tag
        uses: ./.github/actions/compute-tag
        with:
          pr-number: ${{ github.event.pull_request.number }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Needed to push the test image; the AKS cluster pulls it anonymously.
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: curity.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Configure kubeconfig
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CA_CERT: ${{ secrets.KUBE_CA_CERT }}
        run: |
          echo "${KUBE_CA_CERT}" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster aks --server="${KUBE_SERVER}" --certificate-authority=/tmp/ca.crt --embed-certs=true
          kubectl config set-credentials aks-user --token="${KUBE_TOKEN}"
          kubectl config set-context aks --cluster=aks --user=aks-user
          kubectl config use-context aks

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          echo "=== Node architectures ==="
          kubectl get nodes -o wide
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.nodeInfo.architecture}{"\n"}{end}'

      - name: Create operator namespace
        run: kubectl get namespace curity-operator || kubectl create namespace curity-operator

      - name: Run E2E Tests
        run: make test-e2e-remote IMG=curity.azurecr.io/curity/operator:${{ steps.tag.outputs.tag }}

      - name: Collect operator logs
        if: failure()
        run: |
          echo "=== Operator pod status ==="
          kubectl get pods -n curity-operator -o wide || true
          echo "=== Operator pod describe ==="
          kubectl describe pods -l control-plane=controller-manager -n curity-operator || true
          echo "=== Operator logs ==="
          kubectl logs -l control-plane=controller-manager -n curity-operator --all-containers --tail=200 || true
          echo "=== Operator previous logs (if restarted) ==="
          kubectl logs -l control-plane=controller-manager -n curity-operator --all-containers --previous --tail=100 || true

      - name: Cleanup
        if: always()
        run: |
          make undeploy ignore-not-found=true || true
          kubectl delete namespace curity-e2e --ignore-not-found
