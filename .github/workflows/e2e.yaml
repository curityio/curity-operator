name: E2E Tests

on:
  pull_request:
    types: [labeled]

jobs:
  e2e-tests:
    name: Run E2E Tests
    if: ${{ github.event.label.name == 'ok-to-test/e2e' }}
    runs-on: ubuntu-latest
    steps:
      - name: Remove test label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: ok-to-test/e2e

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run E2E Tests
        run: make test-e2e

      - name: Destroy Cluster
        if: always()
        run: make cluster-destroy
