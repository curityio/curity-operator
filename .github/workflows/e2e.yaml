name: E2E Tests

on:
  pull_request:
    types: [labeled]

concurrency:
  group: e2e-aks
  cancel-in-progress: false

# Split into two jobs on purpose. Publishing the test image needs
# packages: write, but the job that runs the suite puts its GITHUB_TOKEN into a
# Kubernetes pull secret on a shared cluster — and the operator under test holds
# cluster-wide secret read in its own RBAC, so it can read that token back.
# Keeping the two apart means the credential that reaches the cluster is
# read-only and cannot publish or overwrite GHCR packages.
jobs:
  build-image:
    name: Build and Push Test Image
    if: ${{ github.event.label.name == 'ok-to-test/e2e' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Remove test label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: ok-to-test/e2e

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compute image tag
        id: tag
        uses: ./.github/actions/compute-tag
        with:
          pr-number: ${{ github.event.pull_request.number }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Test images are CI artifacts, so they go to GHCR — curity.azurecr.io
      # only holds tagged releases.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        env:
          IMG: ghcr.io/curityio/curity-operator:${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          make generate
          make docker-build IMG=$IMG VERSION=$VERSION
          make docker-push IMG=$IMG

  e2e-tests:
    name: Run E2E Tests (AKS)
    needs: build-image
    runs-on: ubuntu-latest
    # packages: read, deliberately — this job's GITHUB_TOKEN is the one stored
    # in the cluster's pull secret, so it must not be able to write packages.
    permissions:
      contents: read
      packages: read
    # Selects config/e2e, which adds the GHCR pull secret to the
    # controller-manager. Job-scoped so deploy and cleanup agree on the overlay;
    # the suite shells out to `make kustomize-deploy` and inherits it.
    env:
      DEPLOY_OVERLAY: config/e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Configure kubeconfig
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CA_CERT: ${{ secrets.KUBE_CA_CERT }}
        run: |
          echo "${KUBE_CA_CERT}" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster aks --server="${KUBE_SERVER}" --certificate-authority=/tmp/ca.crt --embed-certs=true
          kubectl config set-credentials aks-user --token="${KUBE_TOKEN}"
          kubectl config set-context aks --cluster=aks --user=aks-user
          kubectl config use-context aks

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          echo "=== Node architectures ==="
          kubectl get nodes -o wide
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.nodeInfo.architecture}{"\n"}{end}'

      - name: Create operator namespace
        run: kubectl get namespace curity-operator || kubectl create namespace curity-operator

      # Read-only credential: this job has packages: read, so the token stored
      # here can pull the test image and nothing else.
      - name: Create image pull secret
        run: |
          kubectl delete secret ghcr-pull-secret -n curity-operator --ignore-not-found
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=curity-operator

      # test-e2e-run, not test-e2e-remote: the image was published by the
      # build-image job, so this one only installs CRDs and runs the suite.
      - name: Run E2E Tests
        run: make test-e2e-run IMG=ghcr.io/curityio/curity-operator:${{ needs.build-image.outputs.tag }}

      - name: Collect operator logs
        if: failure()
        run: |
          echo "=== Operator pod status ==="
          kubectl get pods -n curity-operator -o wide || true
          echo "=== Operator pod describe ==="
          kubectl describe pods -l control-plane=controller-manager -n curity-operator || true
          echo "=== Operator logs ==="
          kubectl logs -l control-plane=controller-manager -n curity-operator --all-containers --tail=200 || true
          echo "=== Operator previous logs (if restarted) ==="
          kubectl logs -l control-plane=controller-manager -n curity-operator --all-containers --previous --tail=100 || true

      - name: Cleanup
        if: always()
        run: |
          make undeploy ignore-not-found=true || true
          kubectl delete secret ghcr-pull-secret -n curity-operator --ignore-not-found
          kubectl delete namespace curity-e2e --ignore-not-found
