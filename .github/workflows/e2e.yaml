name: E2E Tests

on:
  pull_request:
    types: [labeled]

# Also serialises the start/stop jobs: a run never stops the cluster while
# another run is using it, because the next run only begins once this one —
# stop-cluster included — has finished. aks-stop.yaml shares the group.
concurrency:
  group: e2e-aks
  cancel-in-progress: false

# The AKS cluster is kept stopped between runs. start-cluster brings it up in
# parallel with the image build; stop-cluster always deallocates it again,
# whether the suite passed, failed, was cancelled or never ran. Stopping keeps
# the API server address, CA and service-account token, so the KUBE_* secrets
# stay valid across stop/start.
#
# Azure access is OIDC (no stored secret): AZURE_CLIENT_ID / AZURE_TENANT_ID /
# AZURE_SUBSCRIPTION_ID identify an app registration with a federated credential
# for this repository and a role on the cluster allowing read, start and stop.
# The cluster's name and resource group are repository variables, not literals,
# because the repository is public. See DEVELOPMENT.md.
env:
  AKS_RESOURCE_GROUP: ${{ vars.AKS_RESOURCE_GROUP }}
  AKS_CLUSTER_NAME: ${{ vars.AKS_CLUSTER_NAME }}

# Split into two jobs on purpose. Publishing the test image needs
# packages: write, but the job that runs the suite puts its GITHUB_TOKEN into a
# Kubernetes pull secret on a shared cluster — and the operator under test holds
# cluster-wide secret read in its own RBAC, so it can read that token back.
# Keeping the two apart means the credential that reaches the cluster is
# read-only and cannot publish or overwrite GHCR packages.
jobs:
  build-image:
    name: Build and Push Test Image
    if: ${{ github.event.label.name == 'ok-to-test/e2e' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Remove test label
        uses: actions-ecosystem/action-remove-labels@v1
        with:
          labels: ok-to-test/e2e

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Compute image tag
        id: tag
        uses: ./.github/actions/compute-tag
        with:
          pr-number: ${{ github.event.pull_request.number }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Test images are CI artifacts, so they go to GHCR — curity.azurecr.io
      # only holds tagged releases.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        env:
          IMG: ghcr.io/curityio/curity-operator:${{ steps.tag.outputs.version }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          make generate
          make docker-build IMG=$IMG VERSION=$VERSION
          make docker-push IMG=$IMG

  start-cluster:
    name: Start AKS Cluster
    if: ${{ github.event.label.name == 'ok-to-test/e2e' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start cluster
        run: hack/aks-power.sh start

  e2e-tests:
    name: Run E2E Tests (AKS)
    needs: [build-image, start-cluster]
    runs-on: ubuntu-latest
    # packages: read, deliberately — this job's GITHUB_TOKEN is the one stored
    # in the cluster's pull secret, so it must not be able to write packages.
    permissions:
      contents: read
      packages: read
    # Selects config/e2e, which adds the GHCR pull secret to the
    # controller-manager. Job-scoped so deploy and cleanup agree on the overlay;
    # the suite shells out to `make kustomize-deploy` and inherits it.
    env:
      DEPLOY_OVERLAY: config/e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The namespace-scoped suite installs the operator through the Helm chart.
      - name: Setup Helm
        uses: azure/setup-helm@v4

      - name: Configure kubeconfig
        env:
          KUBE_SERVER: ${{ secrets.KUBE_SERVER }}
          KUBE_TOKEN: ${{ secrets.KUBE_TOKEN }}
          KUBE_CA_CERT: ${{ secrets.KUBE_CA_CERT }}
        run: |
          echo "${KUBE_CA_CERT}" | base64 -d > /tmp/ca.crt
          kubectl config set-cluster aks --server="${KUBE_SERVER}" --certificate-authority=/tmp/ca.crt --embed-certs=true
          kubectl config set-credentials aks-user --token="${KUBE_TOKEN}"
          kubectl config set-context aks --cluster=aks --user=aks-user
          kubectl config use-context aks

      # The cluster was just started: wait until the API server answers and
      # the re-created nodes are Ready before deploying anything.
      - name: Wait for cluster
        timeout-minutes: 15
        run: |
          until kubectl get --raw /readyz >/dev/null 2>&1 &&
            [ -n "$(kubectl get nodes -o name 2>/dev/null)" ] &&
            ! kubectl get nodes --no-headers 2>/dev/null | awk '$2 !~ /^Ready/ { bad=1 } END { exit !bad }'; do
            echo "waiting for API server and nodes..."
            sleep 15
          done

      - name: Verify cluster connectivity
        run: |
          kubectl cluster-info
          echo "=== Node architectures ==="
          kubectl get nodes -o wide
          kubectl get nodes -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.status.nodeInfo.architecture}{"\n"}{end}'

      - name: Create operator namespace
        run: kubectl get namespace curity-operator || kubectl create namespace curity-operator

      # Read-only credential: this job has packages: read, so the token stored
      # here can pull the test image and nothing else.
      - name: Create image pull secret
        run: |
          kubectl delete secret ghcr-pull-secret -n curity-operator --ignore-not-found
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=curity-operator

      # The namespace-scoped suite runs after the main one and installs the
      # operator into curity-e2e-scoped. The main suite's teardown deletes the
      # curity-operator namespace (and the secret above), so this namespace
      # gets its own copy, created up front.
      - name: Create image pull secret for the namespace-scoped suite
        run: |
          kubectl get namespace curity-e2e-scoped || kubectl create namespace curity-e2e-scoped
          kubectl delete secret ghcr-pull-secret -n curity-e2e-scoped --ignore-not-found
          kubectl create secret docker-registry ghcr-pull-secret \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --namespace=curity-e2e-scoped

      # test-e2e-run, not test-e2e-remote: the image was published by the
      # build-image job, so this one only installs CRDs and runs the suites.
      - name: Run E2E Tests
        run: |
          make test-e2e-run \
            IMG=ghcr.io/curityio/curity-operator:${{ needs.build-image.outputs.version }} \
            E2E_PULL_SECRET=ghcr-pull-secret

      - name: Collect operator logs
        if: failure()
        run: |
          echo "=== Operator pod status ==="
          kubectl get pods -n curity-operator -o wide || true
          echo "=== Operator pod describe ==="
          kubectl describe pods -l control-plane=controller-manager -n curity-operator || true
          echo "=== Operator logs ==="
          kubectl logs -l control-plane=controller-manager -n curity-operator --all-containers --tail=200 || true
          echo "=== Operator previous logs (if restarted) ==="
          kubectl logs -l control-plane=controller-manager -n curity-operator --all-containers --previous --tail=100 || true
          echo "=== Namespace-scoped operator pod status ==="
          kubectl get pods -n curity-e2e-scoped -o wide || true
          echo "=== Namespace-scoped operator logs ==="
          kubectl logs -l control-plane=controller-manager -n curity-e2e-scoped --all-containers --tail=200 || true

      - name: Cleanup
        if: always()
        run: |
          helm uninstall curity-operator -n curity-e2e-scoped --ignore-not-found || true
          make undeploy ignore-not-found=true || true
          kubectl delete secret ghcr-pull-secret -n curity-operator --ignore-not-found
          kubectl delete namespace curity-e2e curity-e2e-scoped curity-e2e-scoped-other --ignore-not-found

  # Runs whatever happened before it — suite failure, build failure, a failed
  # start, or a cancelled run — as long as start-cluster was attempted.
  stop-cluster:
    name: Stop AKS Cluster
    needs: [start-cluster, e2e-tests]
    if: ${{ always() && needs.start-cluster.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Retried because a cluster left running is the expensive failure.
      # aks-stop.yaml is the nightly backstop if this still fails.
      - name: Stop cluster
        run: |
          for attempt in 1 2 3; do
            hack/aks-power.sh stop && exit 0
            echo "stop attempt $attempt failed, retrying in 60s..."
            sleep 60
          done
          exit 1
