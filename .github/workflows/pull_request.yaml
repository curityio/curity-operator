name: Pull Request

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate Manifests
        run: make manifests generate

      - name: Lint
        run: make lint

      - name: Unit Tests
        run: make test

      - name: Build
        run: make build

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: curity.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute image tag
        id: tag
        uses: ./.github/actions/compute-tag
        with:
          pr-number: ${{ github.event.pull_request.number }}

      - name: Docker Build and Push
        env:
          IMG: curity.azurecr.io/curity/operator:${{ steps.tag.outputs.tag }}
        run: |
          make docker-build IMG=$IMG
          make docker-push IMG=$IMG

      - name: Generate Helm Chart
        run: make helmify

      - name: Helm Lint
        run: helm lint charts/curity-operator --strict
