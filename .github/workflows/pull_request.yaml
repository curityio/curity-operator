name: Pull Request

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/'

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate Manifests
        run: make manifests generate

      - name: Lint
        run: make lint

      - name: Unit Tests
        run: make test

      - name: Build
        run: make build

      # Build only — nothing is published from a PR. The e2e workflow builds and
      # pushes its own image (test-e2e-remote -> deploy-remote), so a push here
      # would only add a throwaway tag per commit.
      - name: Docker Build
        run: make docker-build IMG=curity-operator:pr-${{ github.event.pull_request.number }}

      - name: Generate Helm Chart
        run: make helmify

      - name: Helm Lint
        run: helm lint charts/curity-operator --strict
