name: Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/'

jobs:
  build-and-push:
    name: Build and Push
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate Manifests
        run: make manifests generate

      - name: Unit Tests
        run: make test

      - name: Build
        run: make build

      # Also authenticates `helm push` below — Helm reads the Docker config
      # this action writes, and the chart lives in the same registry.
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: curity.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Compute image tag
        id: tag
        uses: ./.github/actions/compute-tag

      - name: Docker Build and Push
        env:
          IMG: curity.azurecr.io/curity/operator:${{ steps.tag.outputs.tag }}
        run: |
          make docker-build IMG=$IMG
          make docker-push IMG=$IMG

      - name: Generate and Push Helm Chart
        run: |
          make helmify
          make version-sync VERSION=${{ steps.tag.outputs.version }}
          make helm-push
