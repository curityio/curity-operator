name: Push

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'
      - 'docs/'

jobs:
  build-and-push:
    name: Build and Push
    if: "! contains(toJSON(github.event.commits.*.message), '[skip-ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate Manifests
        run: make manifests generate

      - name: Unit Tests
        run: make test

      - name: Build
        run: make build

      # Main-branch builds are CI artifacts, not releases: they go to GHCR so
      # curity.azurecr.io only ever holds tagged releases. Also authenticates
      # `helm push` below — Helm reads the Docker config this action writes.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tag
        id: tag
        uses: ./.github/actions/compute-tag

      - name: Docker Build and Push
        env:
          IMG: ghcr.io/curityio/curity-operator:${{ steps.tag.outputs.tag }}
        run: |
          make docker-build IMG=$IMG
          make docker-push IMG=$IMG

      - name: Generate and Push Helm Chart
        env:
          IMAGE_REPO: ghcr.io/curityio/curity-operator
        run: |
          make helmify
          make version-sync VERSION=${{ steps.tag.outputs.version }}
          make helm-push HELM_REGISTRY=ghcr.io/curityio/charts
