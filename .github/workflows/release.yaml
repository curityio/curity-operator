name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate and test
        run: |
          make manifests generate
          make test

      # Also authenticates `helm push` below — Helm reads the Docker config
      # this action writes, and the chart lives in the same registry.
      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: curity.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push multi-arch image
        run: |
          make docker-buildx VERSION=${{ steps.version.outputs.version }}
          docker buildx imagetools create \
            curity.azurecr.io/curity/operator:v${{ steps.version.outputs.version }} \
            --tag curity.azurecr.io/curity/operator:latest

      - name: Generate and version Helm chart
        run: |
          make helmify
          make version-sync VERSION=${{ steps.version.outputs.version }}

      - name: Push Helm chart
        run: make helm-push

      - name: Build install.yaml
        run: make build-installer VERSION=${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/install.yaml
