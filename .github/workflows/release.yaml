name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Generate and test
        run: |
          make manifests generate
          make test

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        run: |
          make docker-buildx VERSION=${{ steps.version.outputs.version }}
          docker buildx imagetools create \
            ghcr.io/curityio/curity-operator:v${{ steps.version.outputs.version }} \
            --tag ghcr.io/curityio/curity-operator:latest

      - name: Generate and version Helm chart
        run: |
          make helmify
          make version-sync VERSION=${{ steps.version.outputs.version }}

      - name: Push Helm chart
        run: make helm-push

      - name: Build install.yaml
        run: make build-installer VERSION=${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/install.yaml
