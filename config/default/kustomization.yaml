# Adds namespace to all resources.
namespace: curity-operator

# Value of this field is prepended to the
# names of all resources.
namePrefix: curity-operator-

resources:
- ../crd
- ../rbac
- ../manager

patches:
# Protect the /metrics endpoint by putting it behind auth.
- path: manager_auth_proxy_patch.yaml
# No imagePullSecrets patch: the operator image is published to
# curity.azurecr.io, which has anonymous pull enabled. To deploy from a private
# mirror instead, add imagePullSecrets via your own patch (Kustomize) or
# --set imagePullSecrets[0].name=<secret> (Helm).
