# Targets the resource by its ORIGINAL id (controller-manager in system), not
# the curity-operator-* name config/default's namePrefix and namespace produce.
# Kustomize tracks original ids through transformations, so both spellings match
# today — but the original id keeps matching if that prefix or namespace ever
# changes, whereas a transformed-name patch would silently stop applying and
# leave the e2e deployment without its pull secret (ImagePullBackOff, no error
# from the build).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
