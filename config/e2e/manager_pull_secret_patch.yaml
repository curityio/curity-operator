# Names are already transformed here: config/default applies the
# `curity-operator-` namePrefix and the curity-operator namespace before this
# overlay patches the result.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: curity-operator-controller-manager
  namespace: curity-operator
spec:
  template:
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
