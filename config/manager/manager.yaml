apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: curity-operator
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - command:
        - curity-operator
        args:
        - --health-addr=:8081
        image: controller:latest
        name: manager
        env:
        # PACKAGE_FETCHER_IMAGE overrides the default `alpine:3.19` image
        # used by per-package init containers (see internal/controller/
        # packages.go:ResolvePackageFetcherImage). Set to a private-mirror
        # tag for air-gap clusters where docker.io/alpine:3.19 is not
        # reachable. Helmify templatizes this value so the Helm chart
        # exposes it as .Values.controllerManager.manager.env.packageFetcherImage.
        - name: PACKAGE_FETCHER_IMAGE
          value: "alpine:3.19"
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 10m
            memory: 128Mi
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
