apiVersion: curity.io/v1alpha1
kind: IdentityServerCluster
metadata:
  name: cluster-1
  namespace: curity
spec:
  version: "11.0"
  # image: ""                        # override when using a private mirror
  # imagePullSecret: curity-registry-secret

  # Operator create if not exists and dont delete this secret
  adminCredentials:
    valueFrom:
      secretKeyRef:
        name: curity-admin-secret
        items:
          - key: ADMIN_PASSWORD
            path: ADMIN_PASSWORD
          - key: CONFIG_ENCRYPTION_KEY
            path: CONFIG_ENCRYPTION_KEY
          - key: KEYSTORE_PASSWORD
            path: KEYSTORE_PASSWORD

  # XML config files mounted at startup. Accepts ConfigMap and Secret refs.
  configuration:
    valueFrom:
      configMapRef:
        name: curity-base-config
        items:
          - key: base-config.xml
            path: base-config.xml
      secretRef:
        name: curity-datasource-config
        items:
          - key: base-config.xml
            path: base-config.xml

  # Database configuration
  dataSource:
    type: postgres
    valueFrom:
      secretKeyRef:
        name: curity-datasource-secret
        items:
          - key: host
            path: host
          - key: port
            path: port
          - key: database
            path: database
          - key: username
            path: username
          - key: password
            path: password

# ------------------------------------------------------------
# COMMON WORKLOAD CONFIGURATION FOR ALL NODES
# Node can override these configurations.
# ------------------------------------------------------------

  logging: {}
  
  podAnnotations: {}
  podLabels: {}

  resources:
    requests:
      cpu: "1"
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

  probes:
    liveness: {}
    readiness: {}

  # ------------------------------------------------------------
  # Advanced Configurations
  # ------------------------------------------------------------

  autoscaling:
    enabled: true
    minReplicas: 2                   # keep ≥ 2 for high availability
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    customMetrics: []

  # Minimum pods available during node drains and rolling upgrades.
  podDisruptionBudget:
    minAvailable: 1
  
  nodeSelector: {}
  tolerations: []
  topologySpreadConstraints: []
  affinity: {}
