apiVersion: curity.io/v1alpha1
kind: IdentityServerCluster
metadata:
  # Kubernetes resource name for this cluster; must be unique within the namespace.
  # +kubebuilder:validation:Required
  name: cluster-1
  # Namespace where cluster-scoped secrets/config and node references are resolved.
  # +kubebuilder:validation:Required
  namespace: curity
spec:
  # Tag of the Curity Identity Server container image (for example `11.0`).
  # +kubebuilder:validation:MinLength=1
  # +kubebuilder:validation:MaxLength=128
  version: "11.0"

  # Full container image reference (repository and tag), for example when using a private registry or mirror. Leave empty to use the default repository and `version` as the tag.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxLength=512
  image: ""

  # Name of a Secret in this namespace with credentials for pulling the image (for example a docker config). Leave empty when the image does not require pull secrets.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxLength=253
  imagePullSecret: ""

  # Credentials and key material for admin access, encryption, and keystores; mounted or projected from a Secret.
  # The block is all-or-nothing: omit it entirely and the operator generates a Secret with
  # random values named `<clusterName>-admin-creds` and points the cluster at it; include it
  # and `valueFrom.secretKeyRef` must be fully specified — a partial block is rejected at
  # admission. The bootstrapped Secret survives cluster deletion so credentials are not lost
  # on accidental delete-and-recreate.
  # +kubebuilder:validation:Optional
  adminCredentials:
    # +kubebuilder:validation:Required
    valueFrom:
      secretKeyRef:
        # Secret must contain two data keys with these exact names: ADMIN_PASSWORD,
        # CONFIG_ENCRYPTION_KEY. The operator reads these keys directly in several
        # reconciler paths (Secret bootstrap, encryption-key hashing, genclust Job,
        # admin-UI password projection), so the names are load-bearing and not
        # user-configurable. Only items[].path (the env var name projected into the
        # container) is user-configurable below.
        # +kubebuilder:validation:Required
        # +kubebuilder:validation:MinLength=1
        # +kubebuilder:validation:MaxLength=253
        # +kubebuilder:validation:Pattern=`^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$`
        name: curity-admin-secret
        # The items slice projects two specific Secret keys into Curity pods.
        # Must contain exactly one entry each for ADMIN_PASSWORD and
        # CONFIG_ENCRYPTION_KEY.
        # +kubebuilder:validation:MinItems=2
        # +kubebuilder:validation:MaxItems=2
        # +kubebuilder:validation:XValidation:rule="self.exists_one(i, i.key == 'ADMIN_PASSWORD') && self.exists_one(i, i.key == 'CONFIG_ENCRYPTION_KEY')",message="items must contain exactly one entry each for ADMIN_PASSWORD and CONFIG_ENCRYPTION_KEY"
        # items[].path is the env var NAME projected into the Curity container.
        # Must be a valid POSIX env var identifier — starts with letter or
        # underscore, then alphanumerics or underscore.
        # +kubebuilder:validation:Required
        # +kubebuilder:validation:MinLength=1
        # +kubebuilder:validation:MaxLength=253
        # +kubebuilder:validation:Pattern=`^[A-Za-z_][A-Za-z0-9_]*$`
        items:
          - key: ADMIN_PASSWORD
            path: ADMIN_PASSWORD
          - key: CONFIG_ENCRYPTION_KEY
            path: CONFIG_ENCRYPTION_KEY

  # Remote packages (ZIP archives) to download and unpack into each node's container at startup.
  # Supports public URLs, private GitHub releases, and any HTTP(S) endpoint requiring TLS customisation or credentials.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=20
  # +kubebuilder:validation:XValidation:rule="self.all(p1, self.exists_one(p2, p2.mountPath == p1.mountPath))",message="each package mountPath must be unique"
  packages:
    # When `auth` is set, exactly one of `auth.basicAuth` or `auth.bearerToken` must be present.
    - source:
        # +kubebuilder:validation:XValidation:rule="!has(self.auth) || ((has(self.auth.basicAuth) ? 1 : 0) + (has(self.auth.bearerToken) ? 1 : 0) == 1)",message="exactly one of auth.basicAuth or auth.bearerToken must be set when auth is configured"
        # URL of the ZIP archive to fetch (http or https). Whitespace, control
        # chars, and embedded credentials (userinfo@host) are rejected — use the
        # structured `auth` field for credentials.
        # +kubebuilder:validation:Required
        # +kubebuilder:validation:Pattern=`^https?://[^/@\s]+(/[^\s]*)?$`
        # +kubebuilder:validation:MaxLength=2048
        url: https://github.com/curityio/testing/archive/refs/heads/main.zip

        # TLS options for the download connection. Omit to accept the system trust store.
        # skipVerify=true is mutually exclusive with ca and clientCert.
        # +kubebuilder:validation:Optional
        # +kubebuilder:validation:XValidation:rule="!self.skipVerify || (!has(self.ca) && !has(self.clientCert))",message="tls.skipVerify cannot be combined with tls.ca or tls.clientCert"
        tls:
          # When false (default), the server certificate is validated against the trust store or `ca` below.
          # +kubebuilder:validation:Optional
          enabled: true
          # Set true only in non-production environments to disable certificate verification.
          # +kubebuilder:validation:Optional
          skipVerify: false
          # Custom CA certificate for private or self-signed endpoints. Ignored when `skipVerify` is true.
          # +kubebuilder:validation:Optional
          ca:
            secretRef:
              # +kubebuilder:validation:Required
              # +kubebuilder:validation:MinLength=1
              # +kubebuilder:validation:MaxLength=253
              # +kubebuilder:validation:Pattern=`^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$`
              name: ca-secret
              # +kubebuilder:validation:Required
              # +kubebuilder:validation:MinLength=1
              key: ca.crt
          # Client certificate and key for mutual TLS (mTLS). Secret must contain both tls.crt and tls.key.
          # +kubebuilder:validation:Optional
          clientCert:
            secretRef:
              # +kubebuilder:validation:Required
              # +kubebuilder:validation:MinLength=1
              # +kubebuilder:validation:MaxLength=253
              # +kubebuilder:validation:Pattern=`^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$`
              name: mtls-secret
              # +kubebuilder:validation:Required
              # +kubebuilder:validation:MinLength=1
              key: tls.crt

        # Credentials for authenticated endpoints. When set, exactly one of
        # `basicAuth` or `bearerToken` must be configured.
        # +kubebuilder:validation:Optional
        auth:
          # HTTP Basic Authentication. Suitable for endpoints that accept username/password pairs.
          # +kubebuilder:validation:Optional
          basicAuth:
            secretRef:
              # +kubebuilder:validation:Required
              # +kubebuilder:validation:MinLength=1
              # +kubebuilder:validation:MaxLength=253
              # +kubebuilder:validation:Pattern=`^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$`
              name: basic-auth-secret
              # Key in the Secret holding the username.
              # +kubebuilder:validation:Required
              # +kubebuilder:validation:MinLength=1
              usernameKey: username
              # Key in the Secret holding the password.
              # +kubebuilder:validation:Required
              # +kubebuilder:validation:MinLength=1
              passwordKey: password
          # Bearer token authentication. Use for GitHub PATs, OAuth access tokens, or API keys sent as `Authorization: Bearer <token>`.
          # +kubebuilder:validation:Optional
          bearerToken:
            secretRef:
              # +kubebuilder:validation:Required
              # +kubebuilder:validation:MinLength=1
              # +kubebuilder:validation:MaxLength=253
              # +kubebuilder:validation:Pattern=`^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$`
              name: token-secret
              # +kubebuilder:validation:Required
              # +kubebuilder:validation:MinLength=1
              key: token

      # Absolute path inside the container where the archive contents are unpacked.
      # +kubebuilder:validation:Required
      # +kubebuilder:validation:Pattern=`^/`
      # +kubebuilder:validation:MaxLength=1024
      mountPath: /etc/plugins/testing
      

# ------------------------------------------------------------
# COMMON WORKLOAD CONFIGURATION FOR ALL NODES
# Node can override these configurations.
# ------------------------------------------------------------

  # Default logging options for nodes unless overridden per IdentityServerNode.
  # When `logs` is non-empty, the operator adds sidecar containers that tail files under `var/log` for each named stream to the pod’s stdout. An empty or omitted `logs` disables the sidecars.
  # The `resources` field under `logging` applies only to those sidecars, not the main Identity Server container.
  # +kubebuilder:validation:Optional
  logging:
    # Log level for the main Identity Server container in the pod (default `INFO`).
    # +kubebuilder:validation:Enum=TRACE;DEBUG;INFO;WARN;ERROR;OFF
    # +kubebuilder:validation:Optional
    level: INFO
    # Container image used for log-tailing sidecars (default `busybox:latest`).
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:MaxLength=512
    image: busybox:latest
    # Names of log streams to tail from `var/log` to stdout (for example audit, request, cluster, confsvc, confsvc-internal, post-commit-scripts). A non-empty list deploys one sidecar per stream; empty disables them.
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:MaxItems=32
    # +kubebuilder:validation:items:Enum=audit;request;cluster;confsvc;confsvc-internal;post-commit-scripts
    logs: []
    # CPU and memory limits for logging sidecars. When set, overrides the default logging sidecar resources for this node only.
    # +kubebuilder:validation:Optional
    resources: {}
  
  # Default annotations merged into each node’s Pod template; override per node on IdentityServerNode.
  # +kubebuilder:validation:Optional
  podAnnotations: {}
  # Default labels merged into each node’s Pod template.
  # +kubebuilder:validation:Optional
  podLabels: {}

  # Default CPU and memory requests and limits for the main Identity Server container (not the logging sidecars; use `logging.resources` above for those).
  # +kubebuilder:validation:Optional
  resources:
    # +kubebuilder:validation:Optional
    requests:
      cpu: "1"
      memory: 1Gi
    # +kubebuilder:validation:Optional
    limits:
      cpu: "2"
      memory: 2Gi

  # Default liveness and readiness probes for the main Identity Server container (not sidecars).
  # Leave `liveness` or `readiness` empty to use built-in defaults (HTTP path, timeouts, thresholds, and intervals).
  # +kubebuilder:validation:Optional
  probes:
    # +kubebuilder:validation:Optional
    liveness: {}
    # +kubebuilder:validation:Optional
    readiness: {}

  # ------------------------------------------------------------
  # Pod customization (escape hatches). Nodes inherit these unless overridden on
  # IdentityServerNode (the node value replaces the cluster value entirely — no
  # merge — except securityContext, which the operator merges over its required
  # defaults).
  # ------------------------------------------------------------

  # Default image pull policy for the main Identity Server container (default `IfNotPresent`).
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:Enum=Always;Never;IfNotPresent
  imagePullPolicy: IfNotPresent

  # Default pod termination grace period in seconds (default `30`). Raise it (60–180
  # typical) so Curity's JVM can drain in-flight OAuth/OIDC requests, close DB pools,
  # and deregister from cluster membership on shutdown before SIGKILL.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:Minimum=0
  # +kubebuilder:validation:Maximum=3600
  terminationGracePeriodSeconds: 120

  # Default pod-level security context — accepts the full Kubernetes PodSecurityContext.
  # Unset fields inherit the operator's required defaults (runAsUser 10001,
  # runAsGroup/fsGroup 10000), so a partial override never strips the UID/GID the Curity
  # image needs. Set runAsUser/runAsGroup/fsGroup here only to deliberately override them.
  # +kubebuilder:validation:Optional
  securityContext:
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
    # runAsUser: 10001          # override the operator default only if you must
    # runAsGroup: 10000
    # fsGroup: 10000
    # supplementalGroups: [2000]
    # sysctls: []

  # Default security context for the main Identity Server container — accepts the full
  # Kubernetes container SecurityContext. Example below is a hardened baseline
  # (readOnlyRootFilesystem stays false because the Identity Server writes to its filesystem).
  # +kubebuilder:validation:Optional
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

  # User-defined init containers, run AFTER the operator's package-fetcher init
  # containers. Appended, never overriding operator-managed containers; the name
  # `curity` is reserved and rejected at admission. Standard Kubernetes Container list.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=16
  # +kubebuilder:validation:XValidation:rule="self.all(c, c.name != 'curity')",message="container name 'curity' is reserved by the operator"
  initContainers: []
  #  - name: wait-for-db
  #    image: busybox:1.36
  #    command: ["sh", "-c", "until nc -z db 5432; do sleep 2; done"]

  # User-defined sidecar containers, run alongside the Identity Server container and
  # AFTER the operator's log sidecars. Same naming rules as initContainers.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=16
  # +kubebuilder:validation:XValidation:rule="self.all(c, c.name != 'curity')",message="container name 'curity' is reserved by the operator"
  extraContainers: []
  #  - name: audit-shipper
  #    image: fluent/fluent-bit:3.0

  # ------------------------------------------------------------
  # Advanced Configurations
  # ------------------------------------------------------------

  # Cluster-wide defaults for horizontal pod autoscaling. Nodes inherit these unless overridden on IdentityServerNode.
  # Typically used for runtime nodes that handle traffic; admin nodes usually keep a fixed replica count. You can also set a memory utilization target in the API when the operator supports it.
  # Install the Kubernetes metrics server (or a compatible metrics provider) before relying on CPU- or memory-based autoscaling.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:XValidation:rule="self.minReplicas <= self.maxReplicas",message="minReplicas must be less than or equal to maxReplicas"
  autoscaling:
    # When true, the operator manages a HorizontalPodAutoscaler for eligible workloads.
    # +kubebuilder:validation:Required
    enabled: true
    # Lower bound on replica count while autoscaling is active (commonly `1`; use at least `2` for high availability on runtime nodes).
    # +kubebuilder:validation:Required
    # +kubebuilder:validation:Minimum=1
    minReplicas: 2                   # keep ≥ 2 for high availability
    # Upper bound on replica count while autoscaling is active.
    # +kubebuilder:validation:Required
    # +kubebuilder:validation:Minimum=1
    # +kubebuilder:validation:Maximum=10000
    maxReplicas: 10
    # Average CPU utilization across pods (1–100) at which the workload scales (typical default `80`).
    # +kubebuilder:validation:Required
    # +kubebuilder:validation:Minimum=1
    # +kubebuilder:validation:Maximum=100
    targetCPUUtilizationPercentage: 80
    # Additional HorizontalPodAutoscaler metrics beyond CPU (for example external metrics).
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:MaxItems=100
    customMetrics: []

  # Cluster-wide PodDisruptionBudget defaults. Nodes inherit these unless overridden on IdentityServerNode.
  # During voluntary disruptions (drains, rolling updates), Kubernetes uses this to cap how many pods may be unavailable at once. Set exactly one of `minAvailable` or `maxUnavailable`.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:XValidation:rule="(has(self.minAvailable) ? 1 : 0) + (has(self.maxUnavailable) ? 1 : 0) == 1",message="exactly one of minAvailable or maxUnavailable must be set"
  podDisruptionBudget:
    # Minimum number of pods that must remain available after eviction (integer or percentage string). Mutually exclusive with `maxUnavailable`.
    # Must be non-negative.
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:XIntOrString
    # +kubebuilder:validation:Pattern=`^([0-9]+|[0-9]+%)$`
    # +kubebuilder:validation:XValidation:rule="!(type(self) == int && self < 0)",message="minAvailable must be non-negative"
    minAvailable: 1
    # Maximum number of pods that may be unavailable during eviction (integer or percentage string). Mutually exclusive with `minAvailable`.
    # Must be non-negative.
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:XIntOrString
    # +kubebuilder:validation:Pattern=`^([0-9]+|[0-9]+%)$`
    # +kubebuilder:validation:XValidation:rule="!(type(self) == int && self < 0)",message="maxUnavailable must be non-negative"
    # maxUnavailable: 1
  
  # Cluster-wide node selector: pods run only on nodes whose labels match these key/value pairs.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MinProperties=0
  # +kubebuilder:validation:MaxProperties=100
  nodeSelector: {}
  # Cluster-wide tolerations so pods can schedule onto nodes with matching taints.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=100
  tolerations: []
  # Cluster-wide topology spread constraints to spread pods across failure domains (for example zones or hosts). Requires Kubernetes 1.19 or newer.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=32
  topologySpreadConstraints: []
  # Cluster-wide affinity: control which nodes pods may use and how pods relate to other pods.
  # +kubebuilder:validation:Optional
  affinity: {}

  # Operator-managed NetworkPolicy protecting this cluster's admin node. Cluster-scoped —
  # there is no networkPolicy field on IdentityServerNode. When set (even as an empty
  # object) the operator creates a NetworkPolicy allowing ingress to the admin pods only
  # from same-cluster runtime pods (on the config and distributed-service ports), plus
  # optionally from an API-gateway namespace to the admin-UI port. Omit to manage no
  # policy. Note: a NetworkPolicy only takes effect on a cluster whose CNI enforces it.
  # +kubebuilder:validation:Optional
  networkPolicy:
    # When set and the admin UI is enabled, also allow ingress to the admin-UI port from
    # pods in this namespace. Omit to skip the UI rule.
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:MaxLength=63
    # +kubebuilder:validation:Pattern=`^[a-z0-9]([-a-z0-9]*[a-z0-9])?$`
    apiGatewayNamespace: edge-gateway
