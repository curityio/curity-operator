apiVersion: curity.io/v1alpha1
kind: IdentityServerCluster
metadata:
  # Kubernetes resource name for this cluster; must be unique within the namespace.
  # +kubebuilder:validation:Required
  name: cluster-1
  # Namespace where cluster-scoped secrets/config and node references are resolved.
  # +kubebuilder:validation:Required
  namespace: curity
spec:
  # Tag of the Curity Identity Server container image (for example `11.0`).
  # +kubebuilder:validation:MinLength=1
  # +kubebuilder:validation:MaxLength=128
  version: "11.0"

  # Full container image reference (repository and tag), for example when using a private registry or mirror. Leave empty to use the default repository and `version` as the tag.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxLength=512
  image: ""

  # Name of a Secret in this namespace with credentials for pulling the image (for example a docker config). Leave empty when the image does not require pull secrets.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxLength=253
  imagePullSecret: ""

  # Credentials and key material for admin access, encryption, and keystores; mounted or projected from a Secret.
  # The operator may create the Secret if missing and will not delete it automatically when the cluster is removed.
  # +kubebuilder:validation:Required
  adminCredentials:
    # +kubebuilder:validation:Required
    valueFrom:
      secretKeyRef:
        # Secret containing ADMIN_PASSWORD, CONFIG_ENCRYPTION_KEY, KEYSTORE_PASSWORD (or equivalent keys).
        # +kubebuilder:validation:Required
        name: curity-admin-secret
        # Keys listed here are what the workload requests; OpenAPI/kubebuilder cannot verify the Secret object
        # in the cluster actually contains those keys (no cross-object lookup at CRD validation time).
        # +kubebuilder:validation:Enum=ADMIN_PASSWORD;CONFIG_ENCRYPTION_KEY;KEYSTORE_PASSWORD
        # On the items slice:
        # +kubebuilder:validation:MinItems=3
        # +kubebuilder:validation:MaxItems=3
        items:
          - key: ADMIN_PASSWORD
            path: ADMIN_PASSWORD
          - key: CONFIG_ENCRYPTION_KEY
            path: CONFIG_ENCRYPTION_KEY
          - key: KEYSTORE_PASSWORD
            path: KEYSTORE_PASSWORD

  # Remote packages (ZIP archives) to download and unpack into each node's container at startup.
  # Supports public URLs, private GitHub releases, and any HTTP(S) endpoint requiring TLS customisation or credentials.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=20
  packages:
    - source:
        # Full HTTPS URL of the ZIP archive to fetch.
        # +kubebuilder:validation:Required
        # +kubebuilder:validation:Pattern=`^https?://`
        # +kubebuilder:validation:MaxLength=2048
        url: https://github.com/curityio/testing/archive/refs/heads/main.zip

        # TLS options for the download connection. Omit to accept the system trust store.
        # +kubebuilder:validation:Optional
        tls:
          # When false (default), the server certificate is validated against the trust store or `ca` below.
          # +kubebuilder:validation:Optional
          enabled: true
          # Set true only in non-production environments to disable certificate verification.
          # +kubebuilder:validation:Optional
          skipVerify: false
          # Custom CA certificate for private or self-signed endpoints. Ignored when `skipVerify` is true.
          # +kubebuilder:validation:Optional
          ca:
            secretRef:
              # +kubebuilder:validation:Required
              # +kubebuilder:validation:MaxLength=253
              name: ca-secret
              # +kubebuilder:validation:Required
              key: ca.crt
          # Client certificate and key for mutual TLS (mTLS). Secret must contain both tls.crt and tls.key.
          # +kubebuilder:validation:Optional
          clientCert:
            secretRef:
              # +kubebuilder:validation:Required
              # +kubebuilder:validation:MaxLength=253
              name: mtls-secret
              # +kubebuilder:validation:Required
              key: tls.crt

        # Credentials for authenticated endpoints. Set exactly one of `basicAuth` or `bearerToken`.
        # +kubebuilder:validation:Optional
        auth:
          # HTTP Basic Authentication. Suitable for endpoints that accept username/password pairs.
          # +kubebuilder:validation:Optional
          basicAuth:
            secretRef:
              # +kubebuilder:validation:Required
              # +kubebuilder:validation:MaxLength=253
              name: basic-auth-secret
              # Key in the Secret holding the username.
              # +kubebuilder:validation:Required
              usernameKey: username
              # Key in the Secret holding the password.
              # +kubebuilder:validation:Required
              passwordKey: password
          # Bearer token authentication. Use for GitHub PATs, OAuth access tokens, or API keys sent as `Authorization: Bearer <token>`.
          # +kubebuilder:validation:Optional
          bearerToken:
            secretRef:
              # +kubebuilder:validation:Required
              # +kubebuilder:validation:MaxLength=253
              name: token-secret
              # +kubebuilder:validation:Required
              key: token

      # Absolute path inside the container where the archive contents are unpacked.
      # +kubebuilder:validation:Required
      # +kubebuilder:validation:Pattern=`^/`
      # +kubebuilder:validation:MaxLength=1024
      mountPath: /etc/plugins/testing
      

# ------------------------------------------------------------
# COMMON WORKLOAD CONFIGURATION FOR ALL NODES
# Node can override these configurations.
# ------------------------------------------------------------

  # Default logging options for nodes unless overridden per IdentityServerNode.
  # When `stdout` is true, the operator adds sidecar containers that tail files under `var/log` for each name in `logs` and stream them to the pod’s stdout.
  # The `resources` field under `logging` applies only to those sidecars, not the main Identity Server container.
  # +kubebuilder:validation:Optional
  logging:
    # Log level for the main Identity Server container in the pod (default `INFO`).
    # +kubebuilder:validation:Enum=TRACE;DEBUG;INFO;WARN;ERROR;OFF
    # +kubebuilder:validation:Optional
    level: INFO
    # Container image used for log-tailing sidecars (default `busybox:latest`).
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:MaxLength=512
    image: busybox:latest
    # When true, deploy sidecars that tail additional log files listed in `logs` from `var/log` to stdout.
    # +kubebuilder:validation:Optional
    stdout: false
    # Names of extra log streams to tail when `stdout` is true (for example audit, request, cluster, confsvc, confsvc-internal, post-commit-scripts).
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:MaxItems=32
    # +kubebuilder:validation:items:Enum=audit;request;cluster;confsvc;confsvc-internal;post-commit-scripts
    logs: []
    # CPU and memory limits for logging sidecars. When set, overrides the default logging sidecar resources for this node only.
    # +kubebuilder:validation:Optional
    resources: {}
  
  # Default annotations merged into each node’s Pod template; override per node on IdentityServerNode.
  # +kubebuilder:validation:Optional
  podAnnotations: {}
  # Default labels merged into each node’s Pod template.
  # +kubebuilder:validation:Optional
  podLabels: {}

  # Default CPU and memory requests and limits for the main Identity Server container (not the logging sidecars; use `logging.resources` above for those).
  # +kubebuilder:validation:Optional
  resources:
    # +kubebuilder:validation:Optional
    requests:
      cpu: "1"
      memory: 1Gi
    # +kubebuilder:validation:Optional
    limits:
      cpu: "2"
      memory: 2Gi

  # Default liveness and readiness probes for the main Identity Server container (not sidecars).
  # Leave `liveness` or `readiness` empty to use built-in defaults (HTTP path, timeouts, thresholds, and intervals).
  # +kubebuilder:validation:Optional
  probes:
    # +kubebuilder:validation:Optional
    liveness: {}
    # +kubebuilder:validation:Optional
    readiness: {}

  # ------------------------------------------------------------
  # Advanced Configurations
  # ------------------------------------------------------------

  # Cluster-wide defaults for horizontal pod autoscaling. Nodes inherit these unless overridden on IdentityServerNode.
  # Typically used for runtime nodes that handle traffic; admin nodes usually keep a fixed replica count. You can also set a memory utilization target in the API when the operator supports it.
  # Install the Kubernetes metrics server (or a compatible metrics provider) before relying on CPU- or memory-based autoscaling.
  # +kubebuilder:validation:Optional
  autoscaling:
    # When true, the operator manages a HorizontalPodAutoscaler for eligible workloads.
    # +kubebuilder:validation:Required
    enabled: true
    # Lower bound on replica count while autoscaling is active (commonly `1`; use at least `2` for high availability on runtime nodes).
    # +kubebuilder:validation:Required
    # +kubebuilder:validation:Minimum=1
    minReplicas: 2                   # keep ≥ 2 for high availability
    # Upper bound on replica count while autoscaling is active.
    # +kubebuilder:validation:Required
    # +kubebuilder:validation:Minimum=1
    # +kubebuilder:validation:Maximum=10000
    maxReplicas: 10
    # Average CPU utilization across pods (1–100) at which the workload scales (typical default `80`).
    # +kubebuilder:validation:Required
    # +kubebuilder:validation:Minimum=1
    # +kubebuilder:validation:Maximum=100
    targetCPUUtilizationPercentage: 80
    # Additional HorizontalPodAutoscaler metrics beyond CPU (for example external metrics).
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:MaxItems=100
    customMetrics: []

  # Cluster-wide PodDisruptionBudget defaults. Nodes inherit these unless overridden on IdentityServerNode.
  # During voluntary disruptions (drains, rolling updates), Kubernetes uses this to cap how many pods may be unavailable at once. Set either `minAvailable` or `maxUnavailable`, not both.
  # +kubebuilder:validation:Optional
  podDisruptionBudget:
    # Minimum number of pods that must remain available after eviction (integer or percentage string). Use this or `maxUnavailable`, not both.
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:Minimum=0
    minAvailable: 1
  
  # Cluster-wide node selector: pods run only on nodes whose labels match these key/value pairs.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MinProperties=0
  # +kubebuilder:validation:MaxProperties=100
  nodeSelector: {}
  # Cluster-wide tolerations so pods can schedule onto nodes with matching taints.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=100
  tolerations: []
  # Cluster-wide topology spread constraints to spread pods across failure domains (for example zones or hosts). Requires Kubernetes 1.19 or newer.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=32
  topologySpreadConstraints: []
  # Cluster-wide affinity: control which nodes pods may use and how pods relate to other pods.
  # +kubebuilder:validation:Optional
  affinity: {}
