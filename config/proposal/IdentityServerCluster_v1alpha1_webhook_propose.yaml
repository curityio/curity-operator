# Proposal — additions to IdentityServerCluster.spec.packages[]:
#
#   syncWebhook   optional — signed inbound POSTs from GitHub/Slack
#                            re-fetch `source` and re-apply mounts.
#   mountPaths[]  required — replaces single `mountPath`; each entry is
#                            (archive path, container path).
#
# Mechanism: operator registers a handler on controller-runtime's built-in
# webhook server (`mgr.GetWebhookServer().Register`), publishes the full URL
# on status, verifies HMAC, enqueues reconcile via `source.Channel`. Fixed
# internal debounce coalesces bursts; content-hash dedup makes unchanged
# events no-ops.
#
# Signing secret:
#   github → operator always generates; reference published on
#            `status.packages[].signingSecretRef`. User does not supply one.
#   slack  → user supplies `syncWebhook.signingSecretRef` (Slack issues the
#            value, operator cannot generate it).
---
# Slack-only — copy the Signing Secret from the Slack app's Basic Information
# page into `data.secret`. Skip this Secret entirely for GitHub.
apiVersion: v1
kind: Secret
metadata:
  name: slack-signing
  namespace: curity
type: Opaque
stringData:
  secret: REPLACE_ME
---
apiVersion: curity.io/v1alpha1
kind: IdentityServerCluster
metadata:
  name: cluster-1
  namespace: curity
spec:
  version: "11.0"

  # `name` is required when `syncWebhook` is set and unique within the cluster.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=20
  # +kubebuilder:validation:XValidation:rule="self.all(p, !has(p.syncWebhook) || has(p.name))",message="packages[].name is required when packages[].syncWebhook is set"
  # +kubebuilder:validation:XValidation:rule="self.all(p1, !has(p1.name) || self.exists_one(p2, has(p2.name) && p2.name == p1.name))",message="each packages[].name must be unique within the cluster"
  packages:

    # GitHub — minimum viable config. Operator generates the signing Secret.
    - # Logical name; used to derive the webhook URL path.
      # +kubebuilder:validation:Optional
      # +kubebuilder:validation:MinLength=1
      # +kubebuilder:validation:MaxLength=63
      # +kubebuilder:validation:Pattern=`^[a-z0-9]([-a-z0-9]*[a-z0-9])?$`
      name: plugins-main

      source:
        url: https://github.com/curityio/plugins/archive/refs/heads/main.zip
        auth:
          bearerToken:
            secretRef:
              name: github-pat
              key: token

      # +kubebuilder:validation:Optional
      # +kubebuilder:validation:XValidation:rule="(self.provider == 'slack') == has(self.signingSecretRef)",message="syncWebhook.signingSecretRef must be set iff provider is 'slack' (github keys are operator-generated)"
      syncWebhook:
        # +kubebuilder:validation:Required
        # +kubebuilder:validation:Enum=git;slack
        provider: git
        # signingSecretRef: required for slack, forbidden for git.

      # Each entry: archive path → container path. Destinations unique per package.
      # +kubebuilder:validation:Required
      # +kubebuilder:validation:MinItems=1
      # +kubebuilder:validation:MaxItems=32
      # +kubebuilder:validation:XValidation:rule="self.all(m1, self.exists_one(m2, m2.destination == m1.destination))",message="each mountPaths[].destination must be unique within this package"
      mountPaths:
        - # Archive-relative path; `.` for whole archive; no leading `/` or `..`.
          # +kubebuilder:validation:Required
          # +kubebuilder:validation:MinLength=1
          # +kubebuilder:validation:MaxLength=1024
          # +kubebuilder:validation:Pattern=`^([.]|[^/\s][^\s]*)$`
          # +kubebuilder:validation:XValidation:rule="!self.contains('..')",message="source must not contain '..' segments"
          source: dist/plugins
          # Absolute container path.
          # +kubebuilder:validation:Required
          # +kubebuilder:validation:MaxLength=1024
          # +kubebuilder:validation:Pattern=`^/[^\s]*$`
          destination: /etc/plugins
        - source: dist/post-commit-scripts
          destination: /opt/idsvr/usr/share/post-commit-scripts

    # Slack — user supplies the signing Secret.
    - name: scripts-on-demand
      source:
        url: https://artifacts.internal.example.com/scripts.zip
        auth:
          basicAuth:
            secretRef:
              name: artifact-basic-auth
              usernameKey: username
              passwordKey: password
      syncWebhook:
        provider: slack
        signingSecretRef:
          name: slack-signing
          key: secret
      mountPaths:
        - source: .
          destination: /opt/idsvr/usr/share/scripts

# status.packages[]  (listType=map, listMapKey=name, MaxItems=20):
#   .name              string. Map key.
#   .syncWebhookUrl    string. Set when spec.packages[].syncWebhook is set.
#                      Paste into GitHub "Payload URL" / Slack "Request URL".
#                      Host = chart's `operator.webhookBaseUrl`; path =
#                      /webhooks/<ns>/<cluster>/<name>.
#   .signingSecretRef  secretKeyRef. Set for provider=git (operator-
#                      generated key). Read the value and paste it into
#                      GitHub's webhook "Secret" field.
