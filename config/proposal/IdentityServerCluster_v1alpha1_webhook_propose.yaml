# Proposal — changes to IdentityServerCluster.spec.packages[] (PackageSpec):
#
#  NEW source.type        zip|git (default zip). zip → HTTPS GET + unpack;
#                         git → go-git clone/fetch at source.ref (working tree).
#  NEW source.ref         git ref (branch/tag/SHA); git-only.
#  NEW source.auth.sshKey SSH key (PEM + optional passphrase); git ssh:// only.
#                         Joins existing basicAuth/bearerToken in PackageAuthSpec.
#  NEW syncWebhook        bool. Enables a generic HMAC receiver that re-fetches
#                         source and re-applies mounts on a signed inbound POST.
#                         Operator generates the signing secret into a Secret;
#                         status references it. No provider/vendor coupling.
#  CHG mountPaths[]       replaces single `mountPath`; each entry is (source
#                         path, container path), archive-relative for zip /
#                         repo-relative for git. BREAKING — see note below.
#  CHG source.url         secure transports only — https or ssh (git). Drops
#                         http that PackageSource allows today; breaking for
#                         any http manifest. git:// / ftp:// also rejected.
#  KEPT source.tls        unchanged; applies to https fetches, N/A for ssh.
#
# Open item — mountPath → mountPaths[] drops the cluster-wide mountPath
# uniqueness CEL that PackageSpec guarantees today. Per-package destination
# uniqueness is enforced below, but two packages can still target the same
# container path. Restore the global guarantee with a packages-level CEL or
# move it to the reconciler — decide before promoting this proposal.
#
# Mechanism: operator registers a handler on controller-runtime's built-in
# webhook server (`mgr.GetWebhookServer().Register`), publishes the full URL
# on status, verifies HMAC, enqueues reconcile via `source.Channel`. Fixed
# internal debounce coalesces bursts; content-hash dedup makes unchanged
# events no-ops.
#
# Signing secret: operator generates one HMAC secret per webhook, stores it in a
# Secret, and publishes a secretKeyRef on `status.packages[].signingSecretRef`.
# Callers sign each request (X-Curity-Signature: sha256=HMAC(body)) with that
# value; the operator never accepts a user-supplied secret. The HMAC
# authenticates the caller only — no replay/timestamp guard, since a webhook
# event just enqueues a reconcile and the reconcile path absorbs duplicate
# triggers regardless of source (debounce + content-hash dedup above).
#
# SSH host keys (operator-level): chart ships `git.knownHosts` (ssh-keyscan
# lines, pre-seeded with github/gitlab/bitbucket/azure) → ConfigMap at
# /etc/curity/known_hosts → go-git HostKeyCallback via knownhosts.New. Missing/
# mismatched key fails the clone (no InsecureIgnoreHostKey). Self-hosted: ops
# appends a line. Static — refresh on host-key rotation via chart bump (pin
# ed25519). The sshKey Secret carries only the private key (+ passphrase).
---
# git ssh source — deploy key. Generate with `ssh-keygen -t ed25519`, register
# the public half as a read-only deploy key on the repo. `passphrase` is
# optional; drop the field for an unencrypted key.
apiVersion: v1
kind: Secret
metadata:
  name: plugins-deploy-key
  namespace: curity
type: kubernetes.io/ssh-auth   # mandates the `ssh-privatekey` key
stringData:
  ssh-privatekey: |
    -----BEGIN OPENSSH PRIVATE KEY-----
    REPLACE_ME
    -----END OPENSSH PRIVATE KEY-----
  passphrase: REPLACE_ME
---
apiVersion: curity.io/v1alpha1
kind: IdentityServerCluster
metadata:
  name: cluster-1
  namespace: curity
spec:
  version: "11.0"

  # `name` is required when `syncWebhook` is true (derives the URL path) and
  # unique within the cluster.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=20
  # +kubebuilder:validation:XValidation:rule="self.all(p, !p.syncWebhook || has(p.name))",message="packages[].name is required when packages[].syncWebhook is true"
  # +kubebuilder:validation:XValidation:rule="self.all(p1, !has(p1.name) || self.exists_one(p2, has(p2.name) && p2.name == p1.name))",message="each packages[].name must be unique within the cluster"
  packages:

    # git source over SSH (go-git).
    - # Logical name; used to derive the webhook URL path.
      # +kubebuilder:validation:Optional
      # +kubebuilder:validation:MinLength=1
      # +kubebuilder:validation:MaxLength=63
      # +kubebuilder:validation:Pattern=`^[a-z0-9]([-a-z0-9]*[a-z0-9])?$`
      name: plugins-main

      # Additive over the existing PackageSource: ref is git-only; ssh:// ⇒ git
      # + sshKey; git rejects bearerToken; auth holds exactly one method (the
      # last rule extends the existing PackageSource exactly-one CEL).
      # +kubebuilder:validation:Required
      # +kubebuilder:validation:XValidation:rule="self.type == 'git' || !has(self.ref)",message="source.ref is only valid when source.type is 'git'"
      # +kubebuilder:validation:XValidation:rule="!self.url.startsWith('ssh://') || self.type == 'git'",message="ssh:// urls are only valid for source.type 'git'"
      # +kubebuilder:validation:XValidation:rule="self.url.startsWith('ssh://') == (has(self.auth) && has(self.auth.sshKey))",message="ssh:// requires auth.sshKey, and auth.sshKey requires an ssh:// url"
      # +kubebuilder:validation:XValidation:rule="self.type != 'git' || !has(self.auth) || !has(self.auth.bearerToken)",message="git sources use auth.basicAuth (https) or auth.sshKey (ssh://), not bearerToken"
      # +kubebuilder:validation:XValidation:rule="!has(self.auth) || ((has(self.auth.basicAuth) ? 1 : 0) + (has(self.auth.bearerToken) ? 1 : 0) + (has(self.auth.sshKey) ? 1 : 0) == 1)",message="exactly one of auth.basicAuth, auth.bearerToken, or auth.sshKey must be set when auth is configured"
      source:
        # +kubebuilder:validation:Optional
        # +kubebuilder:validation:Enum=zip;git
        # +kubebuilder:default=zip
        type: git
        # Secure transports only: https (encrypted) or ssh (encrypted + host-key
        # verified). http/git/ftp are rejected. https branch mirrors the existing
        # PackageSource pattern but drops http; ssh adds a user@host branch (git
        # ssh urls need userinfo, which the https branch forbids).
        # +kubebuilder:validation:Required
        # +kubebuilder:validation:MaxLength=2048
        # +kubebuilder:validation:Pattern=`^(https://[^/@\s]+([/?#][^\s]*)?|ssh://[^@/\s]+@[^/@\s]+/[^\s]+)$`
        url: ssh://git@git.example.com/curity/plugins.git
        # Branch, tag, or SHA; defaults to remote HEAD.
        # +kubebuilder:validation:Optional
        # +kubebuilder:validation:MaxLength=255
        ref: main
        # auth — existing PackageAuthSpec + sshKey (new). go-git mapping:
        #   bearerToken  net/http Bearer; zip only (git hosts reject it).
        #   basicAuth    http.BasicAuth; zip, or git https (user + PAT).
        #   sshKey       ssh.PublicKeys; git ssh:// only (host keys: see header).
        # Exactly-one is enforced by the source-level XValidation above.
        # +kubebuilder:validation:Optional
        auth:
          sshKey:
            secretRef:
              name: plugins-deploy-key
              # kubernetes.io/ssh-auth `ssh-privatekey`, PEM.
              privateKeyKey: ssh-privatekey
              # Optional.
              passphraseKey: passphrase
          # HTTPS + PAT alternative (set url: https://git.example.com/...):
          # basicAuth:
          #   secretRef:
          #     name: git-pat
          #     usernameKey: username   # host-dependent; PAT goes in password
          #     passwordKey: password

      # Enables the generic HMAC receiver; operator generates the signing secret
      # and publishes status.packages[].syncWebhookUrl + .signingSecretRef.
      # +kubebuilder:validation:Optional
      # +kubebuilder:default=false
      syncWebhook: true

      # Each entry: source path → container path.
      # +kubebuilder:validation:Required
      # +kubebuilder:validation:MinItems=1
      # +kubebuilder:validation:MaxItems=32
      # +kubebuilder:validation:XValidation:rule="self.all(m1, self.exists_one(m2, m2.destination == m1.destination))",message="each mountPaths[].destination must be unique within this package"
      mountPaths:
        - # Source-relative path (archive root for zip, repo root for git);
          # `.` for the whole tree; no leading `/` or `..`.
          # +kubebuilder:validation:Required
          # +kubebuilder:validation:MaxLength=1024
          # +kubebuilder:validation:Pattern=`^([.]|[^/\s][^\s]*)$`
          # +kubebuilder:validation:XValidation:rule="!self.contains('..')",message="source must not contain '..' segments"
          source: dist/plugins
          # Absolute container path.
          # +kubebuilder:validation:Required
          # +kubebuilder:validation:MaxLength=1024
          # +kubebuilder:validation:Pattern=`^/[^\s]*$`
          destination: /etc/plugins
        - source: dist/post-commit-scripts
          destination: /opt/idsvr/usr/share/post-commit-scripts

    # zip source over https; webhook enabled (same generic receiver).
    - name: scripts-on-demand
      source:
        type: zip
        url: https://artifacts.internal.example.com/scripts.zip
        auth:
          basicAuth:
            secretRef:
              name: artifact-basic-auth
              usernameKey: username
              passwordKey: password
      syncWebhook: true
      mountPaths:
        - source: .
          destination: /opt/idsvr/usr/share/scripts

# status.packages[]  (listType=map, listMapKey=name, MaxItems=20):
#   .name              string. Map key.
#   .syncWebhookUrl    string. POST target for the trigger. Set when
#                      spec.packages[].syncWebhook is true. Host = chart's
#                      `operator.webhookBaseUrl`; path = /webhooks/<ns>/<cluster>/<name>.
#   .signingSecretRef  secretKeyRef into the operator-generated Secret holding
#                      the HMAC key. Set when syncWebhook is true. Callers sign
#                      requests with this value (X-Curity-Signature: sha256=HMAC(body)).
