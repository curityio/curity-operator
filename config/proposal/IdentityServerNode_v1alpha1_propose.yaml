apiVersion: curity.io/v1alpha1
kind: IdentityServerNode
metadata:
  # Kubernetes resource name for this node; must be unique within the namespace.
  # +kubebuilder:validation:Required
  name: curity-admin
  # Namespace where the node workload and related objects are created.
  # +kubebuilder:validation:Required
  namespace: curity
  # Admin nodes are single-active by Curity design. On admin nodes, replicas
  # must be 1 and autoscaling must not be enabled — both enforced at admission.
  # +kubebuilder:validation:XValidation:rule="self.type != 'admin' || self.replicas <= 1",message="replicas must be 1 for admin-type nodes (Curity admin is single-active)"
  # +kubebuilder:validation:XValidation:rule="self.type != 'admin' || !has(self.autoscaling) || !self.autoscaling.enabled",message="autoscaling cannot be enabled on admin-type nodes (Curity admin is single-active)"
spec:
  # Node role in the cluster: admin (configuration/UI) or runtime (token/OAuth traffic).
  # Only one admin node is allowed per cluster; all other nodes must be runtime.
  # +kubebuilder:validation:Enum=admin;runtime
  # +kubebuilder:validation:Required
  type: admin

  # Logical role name for this node; must be unique across all IdentityServerNode resources in the same cluster.
  # +kubebuilder:validation:Required
  # +kubebuilder:validation:MinLength=1
  # +kubebuilder:validation:MaxLength=63
  # +kubebuilder:validation:Pattern=`^[a-z0-9]([-a-z0-9]*[a-z0-9])?$`
  role: node-role-1

  # Admin UI and REST config API exposure. Required when `type` is `admin`; omit when `type` is `runtime`.
  # `enabled` is always required when the ui block is present. `secure` is required only when
  # enabled is true — the CEL rule allows omitting `secure` when the UI is disabled.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:XValidation:rule="!self.enabled || has(self.secure)",message="secure is required when enabled is true"
  ui:
    # When true, the Admin UI is enabled; when false, it is disabled.
    # +kubebuilder:validation:Required
    enabled: true
    # When true, the Admin UI is served over HTTPS; when false, over HTTP.
    # Required only when enabled=true.
    # +kubebuilder:validation:Optional
    secure: true

  # Reference to the IdentityServerCluster that owns configuration and shared settings for this node.
  # +kubebuilder:validation:Required
  identityServerClusterRef:
    # Name of the IdentityServerCluster resource.
    # +kubebuilder:validation:Required
    # +kubebuilder:validation:MinLength=1
    # +kubebuilder:validation:MaxLength=253
    # +kubebuilder:validation:Pattern=`^[a-z0-9]([-.a-z0-9]*[a-z0-9])?$`
    name: cluster-1
    # Namespace of the IdentityServerCluster. Omit or leave empty to use this node’s namespace.
    # +kubebuilder:validation:Optional
    namespace: curity

  # Desired number of pods for this node’s Deployment. Runtime nodes often run multiple replicas for scale and availability; admin is typically one.
  # +kubebuilder:validation:Optional
  # +kubebuilder:default=1
  # +kubebuilder:validation:Minimum=1
  # +kubebuilder:validation:Maximum=10000
  replicas: 1


# ------------------------------------------------------------
# COMMON WORKLOAD CONFIGURATION
# ------------------------------------------------------------
  # Extra annotations merged into the Pod template.
  # +kubebuilder:validation:Optional
  podAnnotations: {}
  # Extra labels merged into the Pod template.
  # +kubebuilder:validation:Optional
  podLabels: {}
  
  # CPU and memory requests and limits for the main Identity Server container. Overrides cluster defaults when set. Not for logging sidecars; use `logging.resources` for those.
  # +kubebuilder:validation:Optional
  resources:
    # +kubebuilder:validation:Optional
    requests:
      cpu: "1"
      memory: 1Gi
    # +kubebuilder:validation:Optional
    limits:
      cpu: "2"
      memory: 2Gi

  # Liveness and readiness probes for the main Identity Server container (not sidecars).
  # Leave a sub-object empty to use built-in defaults for path, timeouts, and thresholds.
  # +kubebuilder:validation:Optional
  probes:
    # +kubebuilder:validation:Optional
    liveness: {}
    # +kubebuilder:validation:Optional
    readiness: {}

  # Kubernetes Service that exposes this node’s pods inside the cluster (and optionally outside it).
  # Required — Curity inter-node DNS depends on the Service, so every node must
  # declare its type and port explicitly.
  # +kubebuilder:validation:Required
  service:
    # How the Service is exposed (`ClusterIP`, `NodePort`, `LoadBalancer`, or `ExternalName`).
    # +kubebuilder:validation:Required
    # +kubebuilder:validation:Enum=ClusterIP;NodePort;LoadBalancer;ExternalName
    type: ClusterIP                  # LoadBalancer or NodePort to expose externally
    # TCP port the Service targets (must match the container listen port for this node role; commonly `6789` for admin, `8443` for runtime).
    # +kubebuilder:validation:Required
    # +kubebuilder:validation:Minimum=1
    # +kubebuilder:validation:Maximum=65535
    port: 8443

  # Additional environment variables for the main container (`name`, `value`, or `valueFrom`).
  # Example:
  # - name: ADMIN_UI_LOGGING_LEVEL
  #   value: DEBUG
  # Prefer Identity Server configuration over env vars when both apply.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=1000
  environmentVariables: []

  # Log-tailing sidecar configuration for this node.
  # When `logs` is non-empty, sidecars tail files under `var/log` for each named stream and write them to stdout. An empty or omitted `logs` disables the sidecars.
  # +kubebuilder:validation:Optional
  logging:
    # Log level for the main Identity Server container (default `INFO`).
    # +kubebuilder:validation:Enum=TRACE;DEBUG;INFO;WARN;ERROR;OFF
    # +kubebuilder:validation:Optional
    level: INFO
    # Image for log-tailing sidecars (default `busybox:latest`).
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:MaxLength=512
    image: busybox:latest
    # Names of log streams to tail from `var/log` to stdout (for example audit, request, cluster, confsvc, confsvc-internal, post-commit-scripts). A non-empty list deploys one sidecar per stream; empty disables them.
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:MaxItems=32
    # +kubebuilder:validation:items:Enum=audit;request;cluster;confsvc;confsvc-internal;post-commit-scripts
    logs: []
    # CPU and memory limits for logging sidecars. When set, overrides cluster defaults for this node.
    # +kubebuilder:validation:Optional
    resources: {}

  # ------------------------------------------------------------
  # Pod customization (escape hatches). Each overrides the cluster default when set
  # (the node value replaces the cluster value entirely — no merge — except
  # securityContext, which is merged over the operator's required defaults).
  # ------------------------------------------------------------

  # Image pull policy for the main Identity Server container (default `IfNotPresent`).
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:Enum=Always;Never;IfNotPresent
  imagePullPolicy: IfNotPresent

  # Pod termination grace period in seconds (default `30`). Raise it (60–180 typical)
  # so Curity's JVM can drain in-flight requests, close DB pools, and deregister from
  # cluster membership on shutdown before SIGKILL.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:Minimum=0
  # +kubebuilder:validation:Maximum=3600
  terminationGracePeriodSeconds: 120

  # Pod-level security context — accepts the full Kubernetes PodSecurityContext. Unset
  # fields inherit the operator's required defaults (runAsUser 10001, runAsGroup/fsGroup
  # 10000), so a partial override never strips the UID/GID the Curity image needs. Set
  # runAsUser/runAsGroup/fsGroup here only to deliberately override them.
  # +kubebuilder:validation:Optional
  securityContext:
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
    # runAsUser: 10001          # override the operator default only if you must
    # runAsGroup: 10000
    # fsGroup: 10000
    # supplementalGroups: [2000]
    # sysctls: []

  # Security context for the main Identity Server container — accepts the full Kubernetes
  # container SecurityContext. Example below is a hardened baseline (readOnlyRootFilesystem
  # stays false because the Identity Server writes to its filesystem).
  # +kubebuilder:validation:Optional
  containerSecurityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    capabilities:
      drop:
        - ALL

  # User-defined init containers, run AFTER the operator's package-fetcher init
  # containers. Appended, never overriding operator-managed containers; the name
  # `curity` is reserved and rejected at admission. Standard Kubernetes Container list.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=16
  # +kubebuilder:validation:XValidation:rule="self.all(c, c.name != 'curity')",message="container name 'curity' is reserved by the operator"
  initContainers: []
  #  - name: wait-for-db
  #    image: busybox:1.36
  #    command: ["sh", "-c", "until nc -z db 5432; do sleep 2; done"]

  # User-defined sidecar containers, run alongside the Identity Server container and
  # AFTER the operator's log sidecars. Same naming rules as initContainers.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=16
  # +kubebuilder:validation:XValidation:rule="self.all(c, c.name != 'curity')",message="container name 'curity' is reserved by the operator"
  extraContainers: []
  #  - name: audit-shipper
  #    image: fluent/fluent-bit:3.0

  # ------------------------------------------------------------
  # Advanced Configurations
  # ------------------------------------------------------------

  # Horizontal pod autoscaling for this node. Most useful for runtime nodes; admin nodes often leave this disabled.
  # Requires a metrics server (or compatible provider) for CPU- and memory-based scaling. Memory utilization targets are supported when exposed by the operator API.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:XValidation:rule="self.minReplicas <= self.maxReplicas",message="minReplicas must be less than or equal to maxReplicas"
  autoscaling:
    # +kubebuilder:validation:Required
    enabled: true
    # Minimum replicas while autoscaling is active (commonly `1`; use at least `2` for HA on runtime).
    # +kubebuilder:validation:Required
    # +kubebuilder:validation:Minimum=1
    minReplicas: 2                   # keep ≥ 2 for high availability
    # Maximum replicas while autoscaling is active.
    # +kubebuilder:validation:Required
    # +kubebuilder:validation:Minimum=1
    # +kubebuilder:validation:Maximum=10000
    maxReplicas: 10
    # Average CPU utilization (1–100) at which the workload scales (typical default `80`).
    # +kubebuilder:validation:Required
    # +kubebuilder:validation:Minimum=1
    # +kubebuilder:validation:Maximum=100
    targetCPUUtilizationPercentage: 80
    # Extra HorizontalPodAutoscaler metrics (for example external metrics).
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:MaxItems=100
    customMetrics: []

  # Limits voluntary disruption of this node’s pods during drains and similar operations. Set exactly one of `minAvailable` or `maxUnavailable`.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:XValidation:rule="(has(self.minAvailable) ? 1 : 0) + (has(self.maxUnavailable) ? 1 : 0) == 1",message="exactly one of minAvailable or maxUnavailable must be set"
  podDisruptionBudget:
    # Minimum pods that must stay available during a disruption (integer or percentage string). Mutually exclusive with `maxUnavailable`.
    # Must be non-negative.
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:XIntOrString
    # +kubebuilder:validation:Pattern=`^([0-9]+|[0-9]+%)$`
    # +kubebuilder:validation:XValidation:rule="!(type(self) == int && self < 0)",message="minAvailable must be non-negative"
    minAvailable: 1
    # Maximum pods that may be unavailable during a disruption (integer or percentage string). Mutually exclusive with `minAvailable`.
    # Must be non-negative.
    # +kubebuilder:validation:Optional
    # +kubebuilder:validation:XIntOrString
    # +kubebuilder:validation:Pattern=`^([0-9]+|[0-9]+%)$`
    # +kubebuilder:validation:XValidation:rule="!(type(self) == int && self < 0)",message="maxUnavailable must be non-negative"
    # maxUnavailable: 1
  
  # Restrict this node’s pods to nodes with matching labels.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MinProperties=0
  # +kubebuilder:validation:MaxProperties=100
  nodeSelector: {}
  # Tolerations for scheduling onto tainted nodes.
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=100
  tolerations: []
  # Spread pods across topology domains (Kubernetes 1.19+).
  # +kubebuilder:validation:Optional
  # +kubebuilder:validation:MaxItems=32
  topologySpreadConstraints: []
  # Affinity and anti-affinity for pod placement.
  # +kubebuilder:validation:Optional
  affinity: {}
