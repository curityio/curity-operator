# Example ConfigMap: non-sensitive configuration fragment for the Curity Identity Server.
# Mounts to /opt/idsvr/etc/init/<path> (see idsvr Helm chart: curity.config.configuration).
# XML shape follows Curity configuration guide: parameterized XML and tail-f config root.
# Ref: https://curity.io/docs/idsvr/latest/configuration-guide/parameterized-configuration.html
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: curity-base-config
  namespace: curity
  labels:
    curity.io/managed: "true"
  annotations:
    curity.io/config-type: "basic"
data:
  base-config.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <config xmlns="http://tail-f.com/ns/config/1.0">
      <environments xmlns="https://curity.se/ns/conf/base">
        <environment>
          <!-- Parameterized at load time from env or startup.properties (see documentation). -->
          <base-url>#{baseUrl | https://localhost:8443}</base-url>
        </environment>
      </environments>
    </config>
