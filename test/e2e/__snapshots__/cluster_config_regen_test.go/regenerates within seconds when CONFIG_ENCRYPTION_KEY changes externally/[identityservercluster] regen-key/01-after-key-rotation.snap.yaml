
[cluster.xml regeneration admin-credentials Secret rotation triggers regen regenerates within seconds when CONFIG_ENCRYPTION_KEY changes externally - 1]
metadata:
  name: regen-key
  namespace: e2e-regen-key
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  finalizers:
    - curity.io/cluster-protection
  managedFields: <Any value>
spec:
  version: "11.0"
  adminCredentials:
    valueFrom:
      secretKeyRef:
        name: ext-creds
        items:
          - key: ADMIN_PASSWORD
            path: PASSWORD
          - key: CONFIG_ENCRYPTION_KEY
            path: CONFIG_ENCRYPTION_KEY
          - key: KEYSTORE_PASSWORD
            path: KEYSTORE_PASSWORD
status:
  conditions:
    - type: Ready
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Available
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Progressing
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Degraded
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: ClusterConfigReady
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
  observedGeneration: <Any value>
  version: "11.0"
  clusterConfigSecretName: regen-key-cluster-config

---
