
[IdentityServerNode customization + NetworkPolicy renders an admin NetworkPolicy and pod-customization fields on the runtime Deployment - 1]
metadata:
  name: custom-runtime
  namespace: e2e-customization
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  labels:
    curity.io/cluster: custom-cluster
  ownerReferences: <Any value>
  finalizers:
    - curity.io/node-protection
  managedFields: <Any value>
spec:
  type: runtime
  role: default
  identityServerClusterRef:
    name: custom-cluster
  replicas: 1
  service:
    type: ClusterIP
    port: 8443
  securityContext:
    fsGroupChangePolicy: OnRootMismatch
  containerSecurityContext:
    readOnlyRootFilesystem: false
    allowPrivilegeEscalation: false
  terminationGracePeriodSeconds: 120
  imagePullPolicy: Always
  initContainers:
    - name: wait-for-db
      image: busybox:1.36
      command:
        - sh
        - -c
        - "true"
  extraContainers:
    - name: audit-shipper
      image: fluent/fluent-bit:3.0
status:
