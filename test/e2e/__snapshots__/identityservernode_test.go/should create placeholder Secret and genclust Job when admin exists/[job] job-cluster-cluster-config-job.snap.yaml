
[IdentityServerNode configuration Cluster config Job creation should create placeholder Secret and genclust Job when admin exists - 1]
metadata:
  name: <Any value>
  namespace: e2e-ccjob
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  labels:
    app.kubernetes.io/managed-by: curity-operator
    curity.io/cluster: job-cluster
    curity.io/component: cluster-config
  annotations: <Any value>
  ownerReferences: <Any value>
  managedFields: <Any value>
spec:
  parallelism: 1
  completions: 1
  podFailurePolicy:
    rules:
      - action: Ignore
        onPodConditions:
          - type: DisruptionTarget
            status: "True"
      - action: FailJob
        onExitCodes:
          containerName: genclust
          operator: In
          values:
            - 1
  backoffLimit: 3
  selector: <Any value>
  manualSelector: false
  template:
    metadata: <Any value>
    spec:
      containers:
        - name: genclust
          image: curity.azurecr.io/curity/idsvr:11.0
          command:
            - /bin/sh
            - -c
            - /opt/idsvr/bin/genclust -c $CONFIG_SERVICE_HOST -p $CONFIG_SERVICE_PORT
          env:
            - name: CONFIG_SERVICE_HOST
              value: job-cluster-job-admin-7fa92c66
            - name: CONFIG_SERVICE_PORT
              value: "6789"
            - name: CONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: job-cluster-admin-creds
                  key: CONFIG_ENCRYPTION_KEY
                  optional: true
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: FallbackToLogsOnError
          imagePullPolicy: IfNotPresent
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10000
        fsGroup: 10000
      schedulerName: default-scheduler
  completionMode: NonIndexed
  suspend: false
  podReplacementPolicy: Failed

---
