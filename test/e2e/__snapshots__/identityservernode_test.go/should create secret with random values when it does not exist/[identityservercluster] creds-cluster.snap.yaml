
[IdentityServerNode credentials Admin credentials auto-generation should create secret with random values when it does not exist - 1]
metadata:
  name: creds-cluster
  namespace: e2e-creds
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  finalizers:
    - curity.io/cluster-protection
  managedFields: <Any value>
spec:
  version: "11.0"
  adminCredentials:
    valueFrom:
      secretKeyRef:
        name: auto-gen-secret
        items:
          - key: ADMIN_PASSWORD
            path: PASSWORD
          - key: CONFIG_ENCRYPTION_KEY
            path: CONFIG_ENCRYPTION_KEY
          - key: KEYSTORE_PASSWORD
            path: KEYSTORE_PASSWORD
status:
  conditions:
    - type: Ready
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Available
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Progressing
      status: "True"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Degraded
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: NoNodes
      message: ""
    - type: ClusterConfigReady
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: WaitingForAdmin
      message: ""
  observedGeneration: <Any value>
  version: "11.0"

---
