
[IdentityServerNode configuration Label-based config discovery Validation Job creation should create validation Job for managed config - 1]
metadata:
  name: <Any value>
  namespace: e2e-cfg-validation-job
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  labels:
    app.kubernetes.io/managed-by: curity-operator
    curity.io/cluster: cfg-vj-cluster
    curity.io/component: config-validation
  annotations: <Any value>
  ownerReferences: <Any value>
  managedFields: <Any value>
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 0
  selector: <Any value>
  manualSelector: false
  template:
    metadata: <Any value>
    spec:
      volumes:
        - name: cfg-cm-vj-config
          configMap:
            name: vj-config
            defaultMode: 420
        - name: tmp
          emptyDir: {}
      containers:
        - name: config-validate
          image: curity.azurecr.io/curity/idsvr:11.0
          command:
            - /usr/bin/bash
            - -c
            - "RESULT_FILE=/tmp/validation_result\n/opt/idsvr/bin/idsvr -s validation --no-admin &\nPID=$!\n# Poll health check — write result and kill idsvr\n(for i in $(seq 1 60); do\n  if (echo > /dev/tcp/localhost/4465) 2>/dev/null; then\n    echo 0 > $RESULT_FILE; kill $PID 2>/dev/null; exit\n  fi\n  sleep 1\ndone; echo 1 > $RESULT_FILE; kill $PID 2>/dev/null) &\n# Wait for idsvr — returns immediately if it crashes\nwait $PID 2>/dev/null\n# If no result file, idsvr crashed before poll could write one\nif [ ! -f $RESULT_FILE ]; then exit 1; fi\nexit $(cat $RESULT_FILE)"
          env:
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cfg-vj-cluster-admin-creds
                  key: ADMIN_PASSWORD
                  optional: true
            - name: CONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cfg-vj-cluster-admin-creds
                  key: CONFIG_ENCRYPTION_KEY
                  optional: true
          volumeMounts:
            - name: cfg-cm-vj-config
              readOnly: true
              mountPath: /opt/idsvr/etc/init/test.xml
              subPath: test.xml
            - name: tmp
              mountPath: /tmp
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Never
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      automountServiceAccountToken: false
      securityContext:
        runAsUser: 10001
        runAsGroup: 10000
        fsGroup: 10000
      schedulerName: default-scheduler
  completionMode: NonIndexed
  suspend: false
  podReplacementPolicy: TerminatingOrFailed

---
