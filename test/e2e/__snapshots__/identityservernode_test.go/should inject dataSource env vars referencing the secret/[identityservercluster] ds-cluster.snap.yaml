
[IdentityServerNode data sources DataSources env var injection should inject dataSource env vars referencing the secret - 1]
metadata:
  name: ds-cluster
  namespace: e2e-datasource
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  finalizers:
    - curity.io/cluster-protection
  managedFields: <Any value>
spec:
  version: "11.0"
  dataSources:
    - type: postgres
      valueFrom:
        secretKeyRef:
          name: ds-db-secret
          items:
            - key: DB_URL
              path: DB_CONNECTION_STRING
            - key: DB_USER
              path: DB_USERNAME
status:
  conditions:
    - type: Ready
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: NodesNotReady
      message: ""
    - type: Available
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: NodesUnavailable
      message: ""
    - type: Progressing
      status: "True"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: NodesProgressing
      message: ""
    - type: Degraded
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: Healthy
      message: ""
    - type: ClusterConfigReady
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: WaitingForAdmin
      message: ""
  observedGeneration: <Any value>
  nodeCount: 1
  version: "11.0"

---
