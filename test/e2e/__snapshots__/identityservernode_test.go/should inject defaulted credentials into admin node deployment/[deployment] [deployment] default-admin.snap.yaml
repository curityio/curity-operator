
[IdentityServerNode credentials Default admin credentials should inject defaulted credentials into admin node deployment - 1]
metadata:
  name: default-creds-default-admin-d4fcb9d8
  namespace: e2e-default-creds
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  labels:
    app.kubernetes.io/component: admin
    app.kubernetes.io/instance: default-creds-default-admin-d4fcb9d8
    app.kubernetes.io/managed-by: curity-operator
    app.kubernetes.io/name: curity-identity-server
    app.kubernetes.io/version: "11.0"
    curity.io/cluster: default-creds
    curity.io/role: admin-ui-role
  ownerReferences: <Any value>
  managedFields: <Any value>
spec:
  replicas: 1
  selector: <Any value>
  template:
    metadata: <Any value>
    spec:
      volumes:
        - name: cluster-config
          secret:
            secretName: default-creds-cluster-config
            items:
              - key: cluster.xml
                path: cluster.xml
            defaultMode: 420
            optional: true
      containers:
        - name: curity
          image: curity.azurecr.io/curity/idsvr:11.0
          args:
            - /opt/idsvr/bin/idsvr
            - -s
            - admin-ui-role
            - -N
            - default-admin
            - --admin
          ports:
            - name: health-check
              containerPort: 4465
              protocol: TCP
            - name: metrics
              containerPort: 4466
              protocol: TCP
            - name: config
              containerPort: 6789
              protocol: TCP
            - name: ds-port
              containerPort: 6790
              protocol: TCP
            - name: admin-ui
              containerPort: 6749
              protocol: TCP
          env:
            - name: STATUS_CMD_PORT
              value: "4465"
            - name: LOGGING_LEVEL
              value: INFO
            - name: ADMIN_UI_HTTP_MODE
              value: "true"
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: default-creds-admin-creds
                  key: ADMIN_PASSWORD
            - name: CONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: default-creds-admin-creds
                  key: CONFIG_ENCRYPTION_KEY
            - name: KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: default-creds-admin-creds
                  key: KEYSTORE_PASSWORD
          volumeMounts:
            - name: cluster-config
              readOnly: true
              mountPath: /opt/idsvr/etc/init/cluster.xml
              subPath: cluster.xml
          livenessProbe:
            httpGet:
              path: /
              port:
                type: 0
                intval: 4465
                strval: ""
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port:
                type: 0
                intval: 4465
                strval: ""
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 3
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext:
        runAsUser: 10001
        runAsGroup: 10000
        fsGroup: 10000
      schedulerName: default-scheduler
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
      priority: 0
      enableServiceLinks: true
      preemptionPolicy: PreemptLowerPriority
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable:
        type: 1
        intval: 0
        strval: 25%
      maxSurge:
        type: 1
        intval: 0
        strval: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
