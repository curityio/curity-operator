
[IdentityServerNode data sources Multiple dataSources should inject env vars from multiple dataSources - 1]
metadata:
  name: multi-ds-cluster
  namespace: e2e-multi-ds
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  finalizers:
    - curity.io/cluster-protection
  managedFields: <Any value>
spec:
  version: "11.0"
  dataSources:
    - type: postgres
      valueFrom:
        secretKeyRef:
          name: main-db
          items:
            - key: host
              path: MAIN_DB_HOST
    - type: postgres
      valueFrom:
        secretKeyRef:
          name: audit-db
          items:
            - key: host
              path: AUDIT_DB_HOST
status:
  conditions:
    - type: Ready
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Available
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Progressing
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Degraded
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: ClusterConfigReady
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
  observedGeneration: <Any value>
  version: "11.0"

---
