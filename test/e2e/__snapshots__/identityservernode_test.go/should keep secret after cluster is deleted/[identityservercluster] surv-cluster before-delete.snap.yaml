    - type: Available
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: NoNodes
      message: No nodes reference this cluster
    - type: Progressing
      status: "True"
      lastTransitionTime: "0001-01-01T00:00:00Z"
