
[IdentityServerNode configuration Multiple configuration sources should mount mixed configmaps and secrets - 1]
metadata:
  name: mix-cluster
  namespace: e2e-multi-config
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  finalizers:
    - curity.io/cluster-protection
  managedFields: <Any value>
spec:
  version: "11.0"
  configuration:
    valueFrom:
      configMapRefs:
        - name: mix-cfg
          items:
            - key: base.xml
              path: base.xml
      secretRefs:
        - name: mix-secret
          items:
            - key: sensitive.xml
              path: sensitive.xml
