
[IdentityServerNode configuration Label-based config discovery Multiple discovered configs should mount multiple discovered configs - 1]
metadata:
  name: cfg-multi-cluster-cfg-multi-admin-456874cb
  namespace: e2e-cfg-multi
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  labels:
    app.kubernetes.io/component: admin
    app.kubernetes.io/instance: cfg-multi-cluster-cfg-multi-admin-456874cb
    app.kubernetes.io/managed-by: curity-operator
    app.kubernetes.io/name: curity-identity-server
    app.kubernetes.io/version: "11.0"
    curity.io/cluster: cfg-multi-cluster
    curity.io/role: admin-role
  ownerReferences: <Any value>
  managedFields: <Any value>
spec:
  replicas: 1
  selector: <Any value>
  template:
    metadata: <Any value>
    spec:
      volumes:
        - name: cluster-config
          secret:
            secretName: cfg-multi-cluster-cluster-config
            items:
              - key: cluster.xml
                path: cluster.xml
            defaultMode: 420
            optional: true
        - name: cfg-cm-base-config-a
          configMap:
            name: base-config-a
            defaultMode: 420
        - name: cfg-cm-base-config-b
          configMap:
            name: base-config-b
            defaultMode: 420
        - name: cfg-secret-secret-config
          secret:
            secretName: secret-config
            defaultMode: 420
      containers:
        - name: curity
          image: curity.azurecr.io/curity/idsvr:11.0
          args:
            - /opt/idsvr/bin/idsvr
            - -s
            - admin-role
            - -N
            - cfg-multi-admin
            - --admin
          ports:
            - name: health-check
              containerPort: 4465
              protocol: TCP
            - name: metrics
              containerPort: 4466
              protocol: TCP
            - name: config
              containerPort: 6789
              protocol: TCP
            - name: ds-port
              containerPort: 6790
              protocol: TCP
            - name: admin-ui
              containerPort: 6749
              protocol: TCP
          env:
            - name: STATUS_CMD_PORT
              value: "4465"
            - name: LOGGING_LEVEL
              value: INFO
            - name: ADMIN_UI_HTTP_MODE
              value: "false"
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cfg-multi-cluster-admin-creds
                  key: ADMIN_PASSWORD
            - name: CONFIG_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cfg-multi-cluster-admin-creds
                  key: CONFIG_ENCRYPTION_KEY
            - name: KEYSTORE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: cfg-multi-cluster-admin-creds
                  key: KEYSTORE_PASSWORD
          volumeMounts:
            - name: cluster-config
              readOnly: true
              mountPath: /opt/idsvr/etc/init/cluster.xml
              subPath: cluster.xml
            - name: cfg-cm-base-config-a
              readOnly: true
              mountPath: /opt/idsvr/etc/init/cm_base-config-a_a.xml
              subPath: a.xml
            - name: cfg-cm-base-config-b
              readOnly: true
              mountPath: /opt/idsvr/etc/init/cm_base-config-b_b.xml
              subPath: b.xml
            - name: cfg-secret-secret-config
              readOnly: true
              mountPath: /opt/idsvr/etc/init/secret_secret-config_s.xml
              subPath: s.xml
          livenessProbe:
            httpGet:
              path: /
              port:
                type: 0
                intval: 4465
                strval: ""
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port:
                type: 0
                intval: 4465
                strval: ""
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
          imagePullPolicy: IfNotPresent
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext:
        runAsUser: 10001
        runAsGroup: 10000
        fsGroup: 10000
      schedulerName: default-scheduler
      tolerations:
        - key: node.kubernetes.io/not-ready
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
        - key: node.kubernetes.io/unreachable
          operator: Exists
          effect: NoExecute
          tolerationSeconds: 300
      priority: 0
      enableServiceLinks: true
      preemptionPolicy: PreemptLowerPriority
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable:
        type: 1
        intval: 0
        strval: 25%
      maxSurge:
        type: 1
        intval: 0
        strval: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600

---
