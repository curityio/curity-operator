
[Test 7: Duplicate admin node rejection should set Degraded on second admin and not create its Deployment - 1]
metadata:
  name: admin-1
  namespace: e2e-dup-admin
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  labels:
    curity.io/cluster: dup-cluster
  annotations: <Any value>
  finalizers:
    - curity.io/node-protection
  managedFields: <Any value>
spec:
  type: admin
  role: admin-role
  ui:
    enabled: true
    secure: true
  identityServerClusterRef:
    name: dup-cluster
  replicas: 1
status:
  conditions:
    - type: Ready
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: DuplicateAdmin
      message: Another admin node already exists for this cluster
    - type: Available
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: NoReplicaAvailable
      message: No replicas are available
    - type: Progressing
      status: "True"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ReplicaUnavailable
      message: 1 replica(s) unavailable
    - type: Degraded
      status: "True"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: DuplicateAdmin
      message: Another admin node "admin-2" already exists for cluster "dup-cluster"
  observedGeneration: <Any value>
  replicas: 1
  updatedReplicas: 1
  unavailableReplicas: 1
  deploymentName: admin-1
  serviceName: admin-1

---
