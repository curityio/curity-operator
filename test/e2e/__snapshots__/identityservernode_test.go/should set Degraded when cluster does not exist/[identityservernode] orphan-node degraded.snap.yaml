
[IdentityServerNode validation and rejection Orphan node should set Degraded when cluster does not exist - 1]
metadata:
  name: orphan-node
  namespace: e2e-orphan
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  labels:
    curity.io/cluster: does-not-exist
  finalizers:
    - curity.io/node-protection
  managedFields: <Any value>
spec:
  type: runtime
  role: orphan-role
  identityServerClusterRef:
    name: does-not-exist
  replicas: 1
  service:
    type: ClusterIP
    port: 8443
status:
  conditions:
    - type: ClusterReady
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Degraded
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Ready
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
  observedGeneration: <Any value>

---
