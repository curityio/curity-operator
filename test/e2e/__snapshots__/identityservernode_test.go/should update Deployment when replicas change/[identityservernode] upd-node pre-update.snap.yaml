
[IdentityServerNode deployment lifecycle Update replicas should update Deployment when replicas change - 1]
metadata:
  name: upd-node
  namespace: e2e-update
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  labels:
    curity.io/cluster: upd-cluster
  finalizers:
    - curity.io/node-protection
  managedFields: <Any value>
spec:
  type: runtime
  role: runtime-role
  identityServerClusterRef:
    name: upd-cluster
  replicas: 1
status:
  conditions:
    - type: Ready
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Available
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Progressing
      status: "True"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Degraded
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: Healthy
      message: ""
  observedGeneration: <Any value>
  replicas: 1
  deploymentName: upd-node
  serviceName: upd-node

