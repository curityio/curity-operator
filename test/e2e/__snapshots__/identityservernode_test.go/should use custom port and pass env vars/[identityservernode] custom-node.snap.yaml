
[Test 9: Custom service port and env vars should use custom port and pass env vars - 1]
metadata:
  name: custom-node
  namespace: e2e-custom
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  labels:
    curity.io/cluster: custom-cluster
  annotations: <Any value>
  finalizers:
    - curity.io/node-protection
  managedFields: <Any value>
spec:
  type: runtime
  role: custom-role
  identityServerClusterRef:
    name: custom-cluster
  replicas: 2
  service:
    type: ClusterIP
    port: 9443
  environmentVariables:
    - name: CUSTOM_ENV
      value: hello-e2e
status:
