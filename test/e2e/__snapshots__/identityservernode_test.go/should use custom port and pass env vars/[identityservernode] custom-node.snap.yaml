      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Available
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Progressing
      status: "True"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Degraded
      status: "False"
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
  observedGeneration: <Any value>
  replicas: 2
  deploymentName: custom-node
  serviceName: custom-node

