
[Multi-cluster config scoping applies scoped configs only to the cluster listed in curity.io/cluster - 1]
metadata:
  name: pri-admin
  namespace: e2e-multi-scope
  uid: <Any value>
  resourceVersion: <Any value>
  generation: <Any value>
  creationTimestamp: <Any value>
  labels:
    curity.io/cluster: primary
  ownerReferences: <Any value>
  finalizers:
    - curity.io/node-protection
  managedFields: <Any value>
spec:
  type: admin
  role: admin-role
  ui:
    enabled: true
    secure: true
  identityServerClusterRef:
    name: primary
  replicas: 1
status:
  conditions:
    - type: Ready
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Available
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Progressing
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: Degraded
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
    - type: ClusterReady
      status: ""
      lastTransitionTime: "0001-01-01T00:00:00Z"
      reason: ""
      message: ""
  observedGeneration: <Any value>
  replicas: 1
  deploymentName: primary-pri-admin
  serviceName: primary-pri-admin
  appliedConfigs:
    - name: base-primary
      kind: ConfigMap
      configType: base
    - name: shared-base
      kind: ConfigMap
      configType: base
    - name: shared-license
      kind: Secret
      configType: license

---
