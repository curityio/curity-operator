apiVersion: curity.io/v1alpha1
kind: IdentityServerNode
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  type: admin
  role: admin-ui-role
  identityServerClusterRef:
    name: {{ .clusterName }}
  ui:
    enabled: {{ .uiEnabled }}
    secure: {{ .uiSecure }}
  service:
    type: ClusterIP
    port: 6789
