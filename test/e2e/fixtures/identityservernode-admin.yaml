apiVersion: curity.io/v1alpha1
kind: IdentityServerNode
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  type: admin
  role: admin-role
  identityServerClusterRef:
    name: {{ .clusterName }}
  replicas: 1
  ui:
    enabled: true
    secure: true
  service:
    type: ClusterIP
    port: 6789
