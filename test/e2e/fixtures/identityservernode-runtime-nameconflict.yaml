apiVersion: curity.io/v1alpha1
kind: IdentityServerNode
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  type: runtime
  role: conflict-role
  identityServerClusterRef:
    name: {{ .clusterName }}
  replicas: 1
  service:
    type: ClusterIP
    port: 8443
  logging:
    logs: ["request"]
  extraContainers:
    - name: request
      image: busybox:1.36
      command: ["sh", "-c", "sleep 3600"]
