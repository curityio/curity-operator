apiVersion: curity.io/v1alpha1
kind: IdentityServerNode
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  type: runtime
  role: pdbmax-role
  identityServerClusterRef:
    name: {{ .clusterName }}
  replicas: 2
  service:
    type: ClusterIP
    port: 8443
  podDisruptionBudget:
    maxUnavailable: 1
