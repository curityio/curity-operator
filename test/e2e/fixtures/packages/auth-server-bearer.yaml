# Tiny nginx that requires `Authorization: Bearer {{ .token }}` for /pkg.zip.
# The ZIP is baked inline as ConfigMap binaryData (a 177-byte ZIP containing
# one file `marker.txt`) so the test is fully hermetic — no github.com or
# any other external network dependency. Used by E2E tests to exercise real
# bearer-auth flow end-to-end.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .serverName }}-config
  namespace: {{ .namespace }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      location = /pkg.zip {
        if ($http_authorization != "Bearer {{ .token }}") {
          return 401 "missing or wrong bearer token\n";
        }
      }
      root /usr/share/nginx/html;
    }
binaryData:
  # Minimal valid ZIP archive containing one file `marker.txt` with content
  # "marker\n". 177 bytes. Regenerate via:
  #   echo marker > marker.txt && zip -q test.zip marker.txt && base64 < test.zip | tr -d '\n'
  pkg.zip: UEsDBAoAAAAAAK2uqFyoFlBoBwAAAAcAAAAKABwAbWFya2VyLnR4dFVUCQADNj/+aTY//ml1eAsAAQT1AQAABBQAAABtYXJrZXIKUEsBAh4DCgAAAAAAra6oXKgWUGgHAAAABwAAAAoAGAAAAAAAAQAAAKSBAAAAAG1hcmtlci50eHRVVAUAAzY//ml1eAsAAQT1AQAABBQAAABQSwUGAAAAAAEAAQBQAAAASwAAAAAA
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .serverName }}
  namespace: {{ .namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .serverName }} }
  template:
    metadata:
      labels: { app: {{ .serverName }} }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: www
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ .serverName }}-config
            items:
              - key: default.conf
                path: default.conf
        - name: www
          configMap:
            name: {{ .serverName }}-config
            items:
              - key: pkg.zip
                path: pkg.zip
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .serverName }}
  namespace: {{ .namespace }}
spec:
  selector: { app: {{ .serverName }} }
  ports:
    - port: 8080
      targetPort: 8080
