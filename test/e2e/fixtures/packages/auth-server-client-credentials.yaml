# Tiny nginx that acts as both an OAuth token endpoint and a bearer-protected
# artifact server, for the auth.clientCredentials E2E test:
#   POST /token   — requires `Authorization: {{ .basicHeader }}` (the
#                   client_secret_basic header for the test client) on a
#                   POST, and returns {{ .token }} as the access_token.
#   GET  /pkg.zip — requires `Authorization: Bearer {{ .token }}`.
# The ZIP is baked inline as ConfigMap binaryData (same 177-byte ZIP as
# auth-server-bearer.yaml) so the test is fully hermetic.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .serverName }}-config
  namespace: {{ .namespace }}
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      location = /token {
        default_type application/json;
        if ($http_authorization != "{{ .basicHeader }}") {
          return 401 '{"error":"invalid_client"}';
        }
        if ($request_method != POST) {
          return 405 '{"error":"invalid_request"}';
        }
        return 200 '{"access_token":"{{ .token }}","token_type":"bearer","expires_in":300}';
      }
      location = /pkg.zip {
        if ($http_authorization != "Bearer {{ .token }}") {
          return 401 "missing or wrong bearer token\n";
        }
      }
      root /usr/share/nginx/html;
    }
binaryData:
  # Minimal valid ZIP archive containing one file `marker.txt` with content
  # "marker\n". 177 bytes. Regenerate via:
  #   echo marker > marker.txt && zip -q test.zip marker.txt && base64 < test.zip | tr -d '\n'
  pkg.zip: UEsDBAoAAAAAAK2uqFyoFlBoBwAAAAcAAAAKABwAbWFya2VyLnR4dFVUCQADNj/+aTY//ml1eAsAAQT1AQAABBQAAABtYXJrZXIKUEsBAh4DCgAAAAAAra6oXKgWUGgHAAAABwAAAAoAGAAAAAAAAQAAAKSBAAAAAG1hcmtlci50eHRVVAUAAzY//ml1eAsAAQT1AQAABBQAAABQSwUGAAAAAAEAAQBQAAAASwAAAAAA
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .serverName }}
  namespace: {{ .namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .serverName }} }
  template:
    metadata:
      labels: { app: {{ .serverName }} }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: www
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ .serverName }}-config
            items:
              - key: default.conf
                path: default.conf
        - name: www
          configMap:
            name: {{ .serverName }}-config
            items:
              - key: pkg.zip
                path: pkg.zip
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .serverName }}
  namespace: {{ .namespace }}
spec:
  selector: { app: {{ .serverName }} }
  ports:
    - port: 8080
      targetPort: 8080
