# nginx serving /pkg.zip on :8443 using the leaf cert above
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .serverName }}-config
  namespace: {{ .namespace }}
data:
  default.conf: |
    server {
      listen 8443 ssl;
      server_name _;
      ssl_certificate     /etc/nginx/tls/tls.crt;
      ssl_certificate_key /etc/nginx/tls/tls.key;
      location = /pkg.zip {}
      root /usr/share/nginx/html;
    }
binaryData:
  # Minimal valid ZIP archive containing one file `marker.txt` with content
  # "marker\n". 177 bytes. Regenerate via:
  #   echo marker > marker.txt && zip -q test.zip marker.txt && base64 < test.zip | tr -d '\n'
  pkg.zip: UEsDBAoAAAAAAK2uqFyoFlBoBwAAAAcAAAAKABwAbWFya2VyLnR4dFVUCQADNj/+aTY//ml1eAsAAQT1AQAABBQAAABtYXJrZXIKUEsBAh4DCgAAAAAAra6oXKgWUGgHAAAABwAAAAoAGAAAAAAAAQAAAKSBAAAAAG1hcmtlci50eHRVVAUAAzY//ml1eAsAAQT1AQAABBQAAABQSwUGAAAAAAEAAQBQAAAASwAAAAAA
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .serverName }}
  namespace: {{ .namespace }}
spec:
  replicas: 1
  selector:
    matchLabels: { app: {{ .serverName }} }
  template:
    metadata:
      labels: { app: {{ .serverName }} }
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8443
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tls
              mountPath: /etc/nginx/tls
              readOnly: true
            - name: www
              mountPath: /usr/share/nginx/html
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: {{ .serverName }}-config
            items:
              - key: default.conf
                path: default.conf
        - name: tls
          secret:
            secretName: {{ .serverName }}-leaf
        - name: www
          configMap:
            name: {{ .serverName }}-config
            items:
              - key: pkg.zip
                path: pkg.zip
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .serverName }}
  namespace: {{ .namespace }}
spec:
  selector: { app: {{ .serverName }} }
  ports:
    - port: 8443
      targetPort: 8443
