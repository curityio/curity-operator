# Tiny nginx that serves /pkg.zip over HTTPS using a leaf cert signed by a
# private demo CA. The Curity init container fetches it via --cacert pointing
# at the CA cert mounted from `tour-ca-secret`. The ZIP is baked inline as
# ConfigMap binaryData (177 bytes) so the test is hermetic.
#
# Cert generation (regenerate if SAN-target hostname changes):
#   cd /tmp/e2e-tls-ca
#   openssl req -x509 -newkey rsa:2048 -keyout ca.key -out ca.crt -days 3650 \
#     -nodes -subj "/CN=E2E Pkg Server CA"
#   openssl req -newkey rsa:2048 -keyout leaf.key -out leaf.csr -nodes \
#     -subj "/CN=pkg-ca-server.e2e-pkg-tls-ca.svc.cluster.local"
#   echo "subjectAltName = DNS:pkg-ca-server.e2e-pkg-tls-ca.svc.cluster.local" > leaf.ext
#   openssl x509 -req -in leaf.csr -CA ca.crt -CAkey ca.key -CAcreateserial \
#     -out leaf.crt -days 3650 -sha256 -extfile leaf.ext
#   openssl req -x509 -newkey rsa:2048 -keyout other-ca.key -out other-ca.crt \
#     -days 3650 -nodes -subj "/CN=E2E Other CA"
#
# The leaf cert's SAN must match the in-cluster service hostname:
#   {{ .serverName }}.{{ .namespace }}.svc.cluster.local
# When .serverName=pkg-ca-server and .namespace=e2e-pkg-tls-ca the SAN above
# matches. If callers change either, regenerate the leaf cert.

