apiVersion: curity.io/v1alpha1
kind: IdentityServerCluster
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  version: "11.0"
  packages:
    - source:
        url: {{ .url }}
        auth:
          bearerToken:
            secretRef:
              name: {{ .tokenSecret }}
              key: token
      mountPath: {{ .mountPath }}
