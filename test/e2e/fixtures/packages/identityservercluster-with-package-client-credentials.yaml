apiVersion: curity.io/v1alpha1
kind: IdentityServerCluster
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  version: "11.0"
  packages:
    - source:
        url: {{ .url }}
        auth:
          clientCredentials:
            tokenEndpoint: {{ .tokenEndpoint }}
            clientId: {{ .clientId }}
            clientSecret:
              secretRef:
                name: {{ .clientSecretName }}
                key: client-secret
            scopes:
              - read
      mountPath: {{ .mountPath }}
