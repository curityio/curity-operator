apiVersion: curity.io/v1alpha1
kind: IdentityServerCluster
metadata:
  name: {{ .name }}
  namespace: {{ .namespace }}
spec:
  version: "11.0"
  packages:
    - source:
        url: {{ .url }}
        tls:
          enabled: true
          ca:
            secretRef:
              name: {{ .caSecret }}
              key: ca.crt
      mountPath: {{ .mountPath }}
